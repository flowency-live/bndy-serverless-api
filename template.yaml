# =============================================================================
# Outputs
# =============================================================================
  # Uniqueness sentinel table (2026-07-27 gate plan). Sentinels live in their
  # own table — NOT in the entity tables — because several read paths
  # full-scan those tables. Retained on stack delete: losing sentinels would
  # re-open every uniqueness hole.
  UniqueKeysTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: bndy-unique-keys
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: key
          AttributeType: S
      KeySchema:
        - AttributeName: key
          KeyType: HASH

  # Activity log (backlog feature 4). One entry per curator/admin write.
  # PK = actor cognito_id, SK = at#suffix. GSI AllByTime = the godmode feed.
  # Retained on stack delete: this is the audit trail.
  ActivityLogTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: bndy-activity-log
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi_pk
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: AllByTime
          KeySchema:
            - AttributeName: gsi_pk
              KeyType: HASH
            - AttributeName: sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # Flags (backlog feature 6): anyone reports a problem on a record.
  # Feature 5's review queue reads this store. Retained on stack delete.
  FlagsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: bndy-flags
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: gsi_status
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ByStatus
          KeySchema:
            - AttributeName: gsi_status
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # Claims (backlog item 8, CLAIM-PAGE-PLAN v2.0): one row per page-claim request.
  # target_key = "artist#<id>" or "venue#<id>". One ACTIVE approved owner per
  # target (D5) is enforced in code via ByTarget before approval.
  # ByStatus feeds the godmode pending/dispute list. Retained: claims are evidence.
  ClaimsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: bndy-claims
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: claim_id
          AttributeType: S
        - AttributeName: gsi_status
          AttributeType: S
        - AttributeName: target_key
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: claim_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ByStatus
          KeySchema:
            - AttributeName: gsi_status
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: ByTarget
          KeySchema:
            - AttributeName: target_key
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: ByUser
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

