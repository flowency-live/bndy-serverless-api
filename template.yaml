AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: BNDY Platform Serverless API

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment stage
  JwtSecret:
    Type: String
    NoEcho: true
    Default: "unused-jwt-secret-fetched-from-ssm-at-runtime"
    Description: JWT secret for authentication (not used - Lambdas fetch from SSM)

Globals:
  Function:
    Runtime: nodejs20.x
    MemorySize: 512
    Timeout: 30
    Tracing: Active
    Environment:
      Variables:
        NODE_ENV: production
        # JWT_SECRET is retrieved from Secrets Manager - see individual functions
        # Hard uniqueness gate (2026-07-27 plan): off | log | enforce.
        # 'log' = collision telemetry only (rollout Phase 4); flip to
        # 'enforce' after sentinel backfill (Phase 5).
        GATE_MODE: enforce
        UNIQUE_KEYS_TABLE: bndy-unique-keys

Resources:
  # =============================================================================
  # HTTP API Gateway
  # =============================================================================
  BndyHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      Description: BNDY Platform HTTP API
      CorsConfiguration:
        # Single source of truth for CORS - Lambda handlers should NOT duplicate this
        AllowOrigins:
          - https://www.bndy.co.uk
          - https://bndy.co.uk
          - https://backstage.bndy.co.uk
          - https://map.bndy.co.uk
          - https://live.bndy.co.uk
          - https://gigmap.bndy.co.uk
          - https://gigs.bndy.co.uk
          - https://bndy.live
          - https://stage.bndy.live
          - http://localhost:3000
          - http://localhost:3001
        AllowHeaders:
          - Content-Type
          - Authorization
          - Cookie
          - X-Requested-With
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowCredentials: true
        MaxAge: 86400

  # =============================================================================
  # Lambda Functions - Core
  # =============================================================================

  # Artists Lambda
  ArtistsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: BNDY Artists API - handles /api/artists endpoints
      CodeUri: ./artists-lambda/
      Handler: handler.handler
      Role: arn:aws:iam::771551874768:role/bndy-api-instance-role
      Layers:
        - arn:aws:lambda:eu-west-2:771551874768:layer:bndy-jwt:3
      Environment:
        Variables:
          JWT_SECRET: '{{resolve:secretsmanager:bndy/jwt-secret:SecretString:secret}}'
          MCP_SERVICE_TOKEN: '{{resolve:secretsmanager:bndy/mcp-service:SecretString:token}}'
      Events:
        CuratorUpdateArtist:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/curator/artists/{id}
            Method: PUT
        CuratorHideArtist:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/curator/artists/{id}/hide
            Method: POST
        CuratorRestoreArtist:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/curator/artists/{id}/restore
            Method: POST
        # Core CRUD
        GetAllArtists:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists
            Method: GET
        CreateArtist:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists
            Method: POST
        # AUDIT FIX F1 (2026-07-27): this route existed in handler.js (the
        # full ADR-014/021/023 resolution ladder) but was NEVER declared here,
        # so API Gateway 404'd it and every client fell back to the no-dedup
        # community route. This 6-line block is the artist-duplication fix.
        FindOrCreateArtist:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/find-or-create
            Method: POST
        FindOrCreateArtistMcp:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/find-or-create/mcp
            Method: POST
        JoinArtist:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/join/artists
            Method: POST
        # SEC-COMMUNITY: Public wizard namespace (no auth, WAF rate-limited)
        CommunityFindOrCreateArtist:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/community/artists/find-or-create
            Method: POST
        CreateCommunityArtist:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/community
            Method: POST
        GetArtistById:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/{id}
            Method: GET
        UpdateArtist:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/{id}
            Method: PUT
        UpdateArtistMcp:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/{id}/mcp
            Method: PUT
        # SEC-AUD-004: MCP DELETE now requires service token auth
        DeleteArtistMcp:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/{id}/mcp
            Method: DELETE
        DeleteArtist:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/{id}
            Method: DELETE
        SearchArtists:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/search
            Method: GET
        GetArtistByExternalId:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/by-external-id
            Method: GET
        ListArtistsMcp:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/list
            Method: GET
        CheckArtistName:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/check-name
            Method: GET
        RefreshFacebookImage:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/{id}/refresh-facebook-image
            Method: POST
        # Enrichment actions (accept/reject AI enrichment)
        ArtistEnrichmentAction:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/{id}/enrichment
            Method: PATCH
        # Artist nested routes
        GetArtistEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/{artistId}/events
            Method: GET

  # Events Lambda
  EventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: BNDY Events API - handles /api/events endpoints
      CodeUri: ./events-lambda/
      Handler: handler.handler
      Role: arn:aws:iam::771551874768:role/bndy-api-instance-role
      Layers:
        - arn:aws:lambda:eu-west-2:771551874768:layer:bndy-jwt:3
      MemorySize: 1024
      Timeout: 60
      Environment:
        Variables:
          JWT_SECRET: '{{resolve:secretsmanager:bndy/jwt-secret:SecretString:secret}}'
          MCP_SERVICE_TOKEN: '{{resolve:secretsmanager:bndy/mcp-service:SecretString:token}}'
      Events:
        # Core CRUD
        GetAllEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/events
            Method: GET
        CreateEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/events
            Method: POST
        CreateCommunityEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/events/community
            Method: POST
        CreateCommunityEventMcp:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/events/community/mcp
            Method: POST
        # SEC-COMMUNITY: Public wizard namespace (no auth, WAF rate-limited, honeypot+time-trap)
        CommunityCreateEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/community/events
            Method: POST
        GetEventById:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/events/{id}
            Method: GET
        UpdateEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/events/{id}
            Method: PUT
        UpdateEventMcp:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/events/{id}/mcp
            Method: PUT
        GetEventMcp:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/events/{id}/mcp
            Method: GET
        # SEC-AUD-004: MCP DELETE now requires service token auth
        DeleteEventMcp:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/events/{id}/mcp
            Method: DELETE
        DeleteEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/events/{id}
            Method: DELETE
        CreateArtistEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/{artistId}/events
            Method: POST
        GetArtistEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/{artistId}/events/{id}
            Method: GET
        UpdateArtistEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/{artistId}/events/{id}
            Method: PUT
        DeleteArtistEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/{artistId}/events/{id}
            Method: DELETE
        LeaveEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/{artistId}/events/{id}/leave
            Method: POST
        GetEventByExternalId:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/events/by-external-id
            Method: GET
        # Public events (Frontstage)
        GetPublicEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/events/public
            Method: GET
        GetPublicEventsGeo:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/events/public/geo
            Method: GET
        # Artist public events (Frontstage)
        GetArtistPublicEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/{artistId}/public-events
            Method: GET
        # Venue events (Frontstage)
        GetVenueEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/venues/{venueId}/events
            Method: GET
        # Availability routes
        ToggleAvailability:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/{artistId}/events/toggle-availability
            Method: POST
        BulkAvailability:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/{artistId}/events/bulk-availability
            Method: POST
        CheckConflicts:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/{artistId}/events/check-conflicts
            Method: POST
        GetPublicAvailability:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/{artistId}/public-availability
            Method: GET
        # Public gigs (MCP/Admin)
        CreatePublicGig:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/{artistId}/public-gigs
            Method: POST
        # Batch operations
        BatchEventsWithJoins:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/events/batch
            Method: POST
  # Calendar Lambda (split from Events to reduce Lambda policy size)

  # Curator routes for events (feature 4/7). SAME code as EventsFunction —
  # split out to keep each function under the 30-route guardrail. The shared
  # router matches by path, so this is a template-only concern split.
  EventsCuratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: BNDY Events Curator API - /api/curator/events routes (same codebase as EventsFunction)
      CodeUri: ./events-lambda/
      Handler: handler.handler
      Role: arn:aws:iam::771551874768:role/bndy-api-instance-role
      Layers:
        - arn:aws:lambda:eu-west-2:771551874768:layer:bndy-jwt:3
      MemorySize: 1024
      Timeout: 60
      Environment:
        Variables:
          JWT_SECRET: '{{resolve:secretsmanager:bndy/jwt-secret:SecretString:secret}}'
          MCP_SERVICE_TOKEN: '{{resolve:secretsmanager:bndy/mcp-service:SecretString:token}}'
      Events:
        CuratorUpdateEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/curator/events/{id}
            Method: PUT
        CuratorHideEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/curator/events/{id}/hide
            Method: POST
        CuratorRestoreEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/curator/events/{id}/restore
            Method: POST
        CuratorCancelEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/curator/events/{id}/cancel
            Method: POST
        CuratorUncancelEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/curator/events/{id}/uncancel
            Method: POST
        CuratorFestivalTag:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/curator/events/festival-tag
            Method: POST

  CalendarFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: BNDY Calendar API - handles calendar and iCal endpoints
      CodeUri: ./events-lambda/
      Handler: handler.handler
      Role: arn:aws:iam::771551874768:role/bndy-api-instance-role
      Layers:
        - arn:aws:lambda:eu-west-2:771551874768:layer:bndy-jwt:3
      MemorySize: 1024
      Timeout: 60
      Environment:
        Variables:
          JWT_SECRET: '{{resolve:secretsmanager:bndy/jwt-secret:SecretString:secret}}'
      Events:
        GetCalendarIcal:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/calendar/ical/{token}
            Method: GET
        GetArtistCalendar:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/{artistId}/calendar
            Method: GET
        CreateCalendarSubscription:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/{artistId}/calendar/subscribe
            Method: POST
        GetCalendarSubscriptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/{artistId}/calendar/subscriptions
            Method: GET
        DeleteCalendarSubscription:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/{artistId}/calendar/subscriptions/{subscriptionId}
            Method: DELETE
        GetEventIcal:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/artists/{artistId}/events/{id}/ical
            Method: GET
        # Moved from EventsFunction to reduce route count
        CreateUserUnavailability:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/users/me/unavailability
            Method: POST
        IntegrationFindOrCreateEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/integration/events
            Method: POST

  # Venues Lambda
  VenuesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: BNDY Venues API - handles /api/venues endpoints
      CodeUri: ./venues-lambda/
      Handler: handler.handler
      Role: arn:aws:iam::771551874768:role/bndy-api-instance-role
      Layers:
        - arn:aws:lambda:eu-west-2:771551874768:layer:bndy-jwt:3
      Environment:
        Variables:
          JWT_SECRET: '{{resolve:secretsmanager:bndy/jwt-secret:SecretString:secret}}'
          GOOGLE_PLACES_API_KEY: '{{resolve:secretsmanager:bndy/google-places:SecretString:api_key}}'
          MCP_SERVICE_TOKEN: '{{resolve:secretsmanager:bndy/mcp-service:SecretString:token}}'
          # Retained production table; it currently exists outside this stack
          # after its DeletionPolicy retained it during the 2026-08-16 rollback.
          VENUE_GROUPS_TABLE: bndy-venue-groups
      Events:
        CuratorUpdateVenue:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/curator/venues/{id}
            Method: PUT
        CuratorHideVenue:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/curator/venues/{id}/hide
            Method: POST
        CuratorRestoreVenue:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/curator/venues/{id}/restore
            Method: POST
        GetAllVenues:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/venues
            Method: GET
        # B1: Places proxy for community gig wizard (no auth, WAF rate-limited)
        PlacesSuggest:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/places/suggest
            Method: GET
        PlacesDetails:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/places/details
            Method: GET
        CreateVenue:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/venues
            Method: POST
        # B5: Removed dead CreateCommunityVenue route (no handler exists)
        FindOrCreateVenue:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/venues/find-or-create
            Method: POST
        FindOrCreateVenueMcp:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/venues/find-or-create/mcp
            Method: POST
        # SEC-COMMUNITY: Public wizard namespace (no auth, WAF rate-limited)
        CommunityFindOrCreateVenue:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/community/venues/find-or-create
            Method: POST
        CommunityPlacesAutocomplete:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/community/places/autocomplete
            Method: GET
        CommunityPlacesDetails:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/community/places/details
            Method: GET
        GetVenueById:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/venues/{id}
            Method: GET
        UpdateVenue:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/venues/{id}
            Method: PUT
        DeleteVenue:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/venues/{id}
            Method: DELETE
        # SEC-AUD-004: MCP DELETE now requires service token auth
        DeleteVenueMcp:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/venues/{id}/mcp
            Method: DELETE
        UpdateVenueMcp:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/venues/{id}/mcp
            Method: PUT
        EnrichVenueMcp:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/venues/{id}/enrich
            Method: POST
        # Enrichment actions (accept/reject AI enrichment)
        VenueEnrichmentAction:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/venues/{id}/enrichment
            Method: PATCH
        GetVenueByExternalId:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/venues/by-external-id
            Method: GET
        ListVenuesMcp:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/venues/list
            Method: GET
        IntegrationVenues:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/integration/venues
            Method: POST
        # Feature 19: venue ownership groups. Reads are public so the godmode
        # screen and, later, Editions can use them without a second lambda.
        # Writes are staff only, checked in the handler against bndy_session.
        ListVenueGroups:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/venue-groups
            Method: GET
        GetVenueGroup:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/venue-groups/{slug}
            Method: GET
        CreateVenueGroup:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/venue-groups
            Method: POST
        UpdateVenueGroup:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/venue-groups/{id}
            Method: PUT
        SetVenueGroup:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/venues/{id}/group
            Method: PUT

  # Festivals Lambda (Phase 1a - festival-mcp-write-api-spec §1)
  FestivalsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: BNDY Festivals API - handles /api/festivals endpoints
      CodeUri: ./festivals-lambda/
      Handler: handler.handler
      Role: arn:aws:iam::771551874768:role/bndy-api-instance-role
      Layers:
        - arn:aws:lambda:eu-west-2:771551874768:layer:bndy-jwt:3
      Environment:
        Variables:
          JWT_SECRET: '{{resolve:secretsmanager:bndy/jwt-secret:SecretString:secret}}'
          MCP_SERVICE_TOKEN: '{{resolve:secretsmanager:bndy/mcp-service:SecretString:token}}'
      Events:
        # Festival CRUD
        CreateFestival:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /festivals
            Method: POST
        UpdateFestival:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /festivals/{id}
            Method: PATCH
        SearchFestivals:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /festivals
            Method: GET
        # Public endpoints
        GetPublicFestivals:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/festivals/public
            Method: GET
        GetFestivalBySlug:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/festivals/slug/{slug}
            Method: GET
        GetFestivalByExternalId:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/festivals/by-external-id
            Method: GET
        # Festival curator builder (FESTIVAL-CURATOR-PLAN.md)
        CuratorCreateFestival:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/curator/festivals
            Method: POST
        CuratorGetFestival:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/curator/festivals/{id}
            Method: GET
        CuratorUpdateFestival:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/curator/festivals/{id}
            Method: PATCH
        # Festival child events (MCP search_event festivalId support)
        GetFestivalEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/festivals/{id}/events
            Method: GET
        # Get festival by UUID (MCP get_by_id support)
        GetFestival:
          Type: HttpApi
          Properties:
            ApiId: !Ref BndyHttpApi
            Path: /api/festivals/{id}
            Method: GET

  # Auth Lambda
  AuthFunction:
    Type: AWS::Serverless::Function
