AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: BNDY public Facebook source inspector - isolated Lambda companion stack

Parameters:
  BndyHttpApiId:
    Type: String
    Description: Existing BNDY HTTP API Gateway v2 API ID (output BndyHttpApiId from bndy-serverless-api stack)

Resources:
  SourceInspectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: BNDY public source inspector - read-only Facebook metadata and artist identity lookup
      CodeUri: ./artists-lambda/
      Handler: source-inspector-v3.handler
      Runtime: nodejs20.x
      MemorySize: 256
      Timeout: 8
      Role: arn:aws:iam::771551874768:role/bndy-api-instance-role
      Layers:
        - arn:aws:lambda:eu-west-2:771551874768:layer:bndy-jwt:3
      Environment:
        Variables:
          NODE_ENV: production
          UNIQUE_KEYS_TABLE: bndy-unique-keys
          ARTISTS_TABLE: bndy-artists

  # The main SAM stack owns the HttpApi definition and can replace its route set
  # during an unrelated deployment. Keeping an ApiGatewayV2::Route in this
  # companion stack therefore creates irreparable CloudFormation drift: the
  # companion stack still believes the route exists after the main stack has
  # removed it. The deployment workflow now reconciles the integration + route
  # imperatively after every successful main API deployment instead.
  SourceInspectorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SourceInspectorFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${BndyHttpApiId}/*/POST/api/community/source/inspect

Outputs:
  SourceInspectorFunctionArn:
    Description: Source inspector Lambda ARN used by the API route reconciler
    Value: !GetAtt SourceInspectorFunction.Arn
