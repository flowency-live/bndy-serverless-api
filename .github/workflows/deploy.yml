name: Deploy BNDY API

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  AWS_REGION: eu-west-2
  NODE_VERSION: '20'
  SAM_CLI_TELEMETRY: '0'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Run Lambda Tests
        run: |
          # Run tests for each lambda that has both test files AND a valid test script
          for dir in *-lambda/; do
            if [[ -d "$dir" && -f "$dir/package.json" ]]; then
              # Check if package.json has a real test script (not placeholder)
              if grep -q '"test":' "$dir/package.json" && ! grep -q 'no test specified' "$dir/package.json"; then
                if ls "$dir"/*.test.js 1> /dev/null 2>&1; then
                  echo "Running tests in $dir"
                  cd "$dir"
                  npm install --legacy-peer-deps
                  npm test || exit 1
                  cd ..
                else
                  echo "Skipping $dir (no test files)"
                fi
              else
                echo "Skipping $dir (no valid test script)"
              fi
            fi
          done

  validate:
    name: Validate SAM Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Validate SAM Template
        run: sam validate --no-lint  # Skipping lint due to nodejs20.x deprecation warnings (to be upgraded to nodejs24.x)

      - name: Verify Critical Routes
        run: |
          cd scripts
          npm install
          node verify-routes.js

  deploy:
    name: Deploy to AWS
    needs: [test, validate]
    runs-on: ubuntu-latest
    # Only deploy on push to master (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Lambda Dependencies
        run: |
          # Install production dependencies for each lambda
          for dir in *-lambda/; do
            if [[ -d "$dir" && -f "$dir/package.json" ]]; then
              echo "Installing dependencies in $dir"
              cd "$dir"
              npm install --production --legacy-peer-deps --ignore-scripts
              cd ..
            fi
          done

      - name: SAM Build
        run: sam build --parallel

      - name: SAM Deploy
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name bndy-serverless-api \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --s3-bucket bndy-deployment-artifacts-1758805276 \
            --s3-prefix bndy-serverless-api

      - name: Wait for API Gateway propagation
        run: sleep 10

      - name: Run Smoke Tests
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh
        env:
          API_URL: https://api.bndy.co.uk

      - name: Output Stack Info
        run: |
          aws cloudformation describe-stacks \
            --stack-name bndy-serverless-api \
            --query "Stacks[0].Outputs" \
            --output table
