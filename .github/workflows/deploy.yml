name: Deploy BNDY API

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

env:
  AWS_REGION: eu-west-2
  NODE_VERSION: '20'
  SAM_CLI_TELEMETRY: '0'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Run Lambda Tests
        run: |
          for dir in *-lambda/; do
            if [[ -d "$dir" && -f "$dir/package.json" ]]; then
              if grep -q '"test":' "$dir/package.json" && ! grep -q 'no test specified' "$dir/package.json"; then
                if ls "$dir"/*.test.js 1> /dev/null 2>&1; then
                  echo "Running tests in $dir"
                  cd "$dir"
                  npm install --legacy-peer-deps
                  npm test || exit 1
                  cd ..
                else
                  echo "Skipping $dir (no test files)"
                fi
              else
                echo "Skipping $dir (no valid test script)"
              fi
            fi
          done

      - name: Run Shared Artist Domain Guards
        run: |
          echo "=== Artist taxonomy contract + copy drift ==="
          node --test shared/artist-domain/taxonomy.test.js
          echo ""
          echo "=== Identity/domain copy drift ==="
          node shared/identity/check-sync.test.js

  validate:
    name: Validate deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run Pre-Deployment Validation
        run: |
          cd scripts
          npm install
          echo "=== Pre-Deployment Validation ==="
          node validate-deployment.js
          echo ""
          echo "=== Critical Route Verification ==="
          node verify-routes.js

  deploy:
    name: Deploy to AWS
    needs: [test, validate]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Lambda Dependencies
        run: |
          for dir in *-lambda/; do
            if [[ -d "$dir" && -f "$dir/package.json" ]]; then
              echo "Installing dependencies in $dir"
              cd "$dir"
              npm install --production --legacy-peer-deps --ignore-scripts
              cd ..
            fi
          done

      - name: SAM Build
        run: sam build --parallel

      - name: SAM Deploy
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name bndy-serverless-api \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --s3-bucket bndy-deployment-artifacts-1758805276 \
            --s3-prefix bndy-serverless-api

      - name: Wait for API Gateway propagation
        run: sleep 10

      - name: Run Smoke Tests
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh
        env:
          API_URL: https://api.bndy.co.uk

      - name: Output Stack Info
        run: |
          aws cloudformation describe-stacks \
            --stack-name bndy-serverless-api \
            --query "Stacks[0].Outputs" \
            --output table

  enrichment_gsi_recovery:
    name: One-shot bndy-enrichment staged GSI recovery
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, 'Run Enrichment GSI recovery')

    steps:
      - name: Checkout result repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout bndy-enrichment main
        uses: actions/checkout@v4
        with:
          repository: flowency-live/bndy-enrichment
          ref: main
          path: enrichment

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Inspect current enrichment table
        id: inspect
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          STATE_TABLE=$(aws cloudformation describe-stacks \
            --stack-name BndyEnrichmentStack --region eu-west-2 \
            --query "Stacks[0].Outputs[?OutputKey=='StateTableName'].OutputValue | [0]" \
            --output text)
          if [ -z "$STATE_TABLE" ] || [ "$STATE_TABLE" = "None" ]; then
            STATE_TABLE=$(aws cloudformation list-stack-resources \
              --stack-name BndyEnrichmentStack --region eu-west-2 \
              --query "StackResourceSummaries[?ResourceType=='AWS::DynamoDB::Table'].PhysicalResourceId | [0]" \
              --output text)
          fi
          test -n "$STATE_TABLE" && test "$STATE_TABLE" != "None"
          echo "STATE_TABLE=$STATE_TABLE" >> "$GITHUB_ENV"
          aws dynamodb describe-table --region eu-west-2 --table-name "$STATE_TABLE" \
            --query 'Table.GlobalSecondaryIndexes[].IndexName' --output json > /tmp/gsi-before.json
          cat /tmp/gsi-before.json

      - name: Install enrichment dependencies
        id: install
        if: steps.inspect.outcome == 'success'
        continue-on-error: true
        working-directory: enrichment
        run: npm install

      - name: Add missing GSIs one CloudFormation update at a time
        id: recover
        if: steps.inspect.outcome == 'success' && steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: enrichment
        shell: bash
        run: |
          set -euo pipefail
          cp lib/bndy-enrichment-stack.ts /tmp/bndy-enrichment-stack.original.ts

          python - <<'PY'
          import json
          before = set(json.load(open('/tmp/gsi-before.json')) or [])
          expected = ['SourceScheduleIndex', 'ObservationClaimsIndex', 'SubjectClaimsIndex']
          unknown = sorted(before - set(expected))
          if unknown:
              raise SystemExit(f'Unexpected GSI(s) on enrichment state table: {unknown}')
          if 'ObservationClaimsIndex' in before and 'SourceScheduleIndex' not in before:
              raise SystemExit('Unexpected GSI order: ObservationClaimsIndex exists without SourceScheduleIndex')
          if 'SubjectClaimsIndex' in before and 'ObservationClaimsIndex' not in before:
              raise SystemExit('Unexpected GSI order: SubjectClaimsIndex exists without ObservationClaimsIndex')
          print('Current expected GSIs:', sorted(before))
          PY

          stage_file() {
            local stage="$1"
            cp /tmp/bndy-enrichment-stack.original.ts lib/bndy-enrichment-stack.ts
            STAGE="$stage" python - <<'PY'
          import os, re, pathlib
          stage = int(os.environ['STAGE'])
          path = pathlib.Path('lib/bndy-enrichment-stack.ts')
          text = path.read_text()
          order = [
              ('SourceScheduleIndex', 1),
              ('ObservationClaimsIndex', 2),
              ('SubjectClaimsIndex', 3),
          ]
          for name, required_stage in order:
              if required_stage <= stage:
                  continue
              pattern = re.compile(
                  r"\n    table\.addGlobalSecondaryIndex\(\{\n"
                  r"      indexName: '" + re.escape(name) + r"',.*?\n"
                  r"    \}\);\n",
                  re.S,
              )
              text, count = pattern.subn('\n', text, count=1)
              if count != 1:
                  raise SystemExit(f'Could not remove exactly one {name} block; removed {count}')
          path.write_text(text)
          PY
          }

          has_gsi() {
            jq -e --arg name "$1" 'index($name) != null' /tmp/gsi-before.json >/dev/null
          }

          if ! has_gsi SourceScheduleIndex; then
            echo '=== Stage 1: SourceScheduleIndex ==='
            stage_file 1
            npx cdk deploy BndyEnrichmentStack --require-approval never
            aws dynamodb wait table-exists --region eu-west-2 --table-name "$STATE_TABLE"
          fi

          aws dynamodb describe-table --region eu-west-2 --table-name "$STATE_TABLE" \
            --query 'Table.GlobalSecondaryIndexes[].IndexName' --output json > /tmp/gsi-stage1.json
          cp /tmp/gsi-stage1.json /tmp/gsi-before.json

          if ! jq -e 'index("ObservationClaimsIndex") != null' /tmp/gsi-stage1.json >/dev/null; then
            echo '=== Stage 2: ObservationClaimsIndex ==='
            stage_file 2
            npx cdk deploy BndyEnrichmentStack --require-approval never
            aws dynamodb wait table-exists --region eu-west-2 --table-name "$STATE_TABLE"
          fi

          aws dynamodb describe-table --region eu-west-2 --table-name "$STATE_TABLE" \
            --query 'Table.GlobalSecondaryIndexes[].IndexName' --output json > /tmp/gsi-stage2.json

          if ! jq -e 'index("SubjectClaimsIndex") != null' /tmp/gsi-stage2.json >/dev/null; then
            echo '=== Stage 3: SubjectClaimsIndex and full desired stack ==='
            stage_file 3
            npx cdk deploy BndyEnrichmentStack --require-approval never
            aws dynamodb wait table-exists --region eu-west-2 --table-name "$STATE_TABLE"
          else
            echo '=== All GSIs already present; deploy full desired stack once ==='
            stage_file 3
            npx cdk deploy BndyEnrichmentStack --require-approval never
          fi

          cp /tmp/bndy-enrichment-stack.original.ts lib/bndy-enrichment-stack.ts
          aws dynamodb describe-table --region eu-west-2 --table-name "$STATE_TABLE" \
            --query 'Table.GlobalSecondaryIndexes[].{name:IndexName,status:IndexStatus}' \
            --output json > /tmp/gsi-after.json
          cat /tmp/gsi-after.json

          jq -e '
            (map(select(.status == "ACTIVE")) | map(.name) | sort) ==
            (["ObservationClaimsIndex","SourceScheduleIndex","SubjectClaimsIndex"] | sort)
          ' /tmp/gsi-after.json >/dev/null

      - name: Record GSI recovery result on non-triggering branch
        if: always()
        env:
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          RECOVER_OUTCOME: ${{ steps.recover.outcome }}
        shell: bash
        run: |
          set -u
          mkdir -p diagnostics
          [ -s /tmp/gsi-before.json ] || echo '[]' > /tmp/gsi-before.json
          if [ -n "${STATE_TABLE:-}" ]; then
            aws dynamodb describe-table --region eu-west-2 --table-name "$STATE_TABLE" \
              --query 'Table.GlobalSecondaryIndexes[].{name:IndexName,status:IndexStatus}' \
              --output json > /tmp/gsi-final.json 2>/dev/null || echo '[]' > /tmp/gsi-final.json
            STACK_STATUS=$(aws cloudformation describe-stacks --region eu-west-2 \
              --stack-name BndyEnrichmentStack --query 'Stacks[0].StackStatus' --output text 2>/dev/null || true)
          else
            echo '[]' > /tmp/gsi-final.json
            STACK_STATUS='unknown'
          fi

          jq -n \
            --arg inspectedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg table "${STATE_TABLE:-unknown}" \
            --arg stackStatus "$STACK_STATUS" \
            --arg inspect "$INSPECT_OUTCOME" \
            --arg install "$INSTALL_OUTCOME" \
            --arg recover "$RECOVER_OUTCOME" \
            --argjson before "$(cat /tmp/gsi-before.json)" \
            --argjson final "$(cat /tmp/gsi-final.json)" \
            '{result:"ENRICHMENT_GSI_RECOVERY",inspectedAt:$inspectedAt,stateTable:$table,stackStatus:$stackStatus,steps:{inspect:$inspect,install:$install,recover:$recover},before:$before,final:$final}' \
            > diagnostics/enrichment-gsi-recovery.json

          git config user.name 'bndy-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add diagnostics/enrichment-gsi-recovery.json
          git commit -m 'Record enrichment GSI recovery result' || exit 0
          git push --force origin HEAD:enrichment-gsi-recovery-results
