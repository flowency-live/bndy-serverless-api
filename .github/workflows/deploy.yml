name: Deploy BNDY API

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Type "deploy" to confirm deployment'
        required: true
        type: string

permissions:
  contents: write

env:
  AWS_REGION: eu-west-2
  NODE_VERSION: '22'
  SAM_CLI_TELEMETRY: '0'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Run Lambda Tests
        run: |
          # Run tests for each lambda that has both test files AND a valid test script
          for dir in *-lambda/; do
            if [[ -d "$dir" && -f "$dir/package.json" ]]; then
              # Check if package.json has a real test script (not placeholder).
              # Discover tests recursively so __tests__/ suites are not silently skipped.
              if grep -q '"test":' "$dir/package.json" && ! grep -q 'no test specified' "$dir/package.json"; then
                if find "$dir" -type f \( -name '*.test.js' -o -path '*/__tests__/*.js' \) -print -quit | grep -q .; then
                  echo "Running tests in $dir"
                  cd "$dir"
                  npm ci --legacy-peer-deps
                  npm test || exit 1
                  cd ..
                else
                  echo "Skipping $dir (no test files)"
                fi
              else
                echo "Skipping $dir (no valid test script)"
              fi
            fi
          done

      - name: Run Shared Artist Domain Guards
        run: |
          echo "=== Artist taxonomy contract + copy drift ==="
          node --test shared/artist-domain/taxonomy.test.js
          echo ""
          echo "=== Identity/domain copy drift ==="
          node shared/identity/check-sync.test.js

  validate:
    name: Validate deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Run Pre-Deployment Validation
        run: |
          # SAM CLI 1.165 now fails validation on the estate-wide Node 20
          # deprecation warning. The deploy job still runs `sam build` before
          # `sam deploy`, so malformed SAM templates cannot be deployed. Keep
          # the repo's route/config validators as the pre-deploy gate here.
          cd scripts
          npm install
          echo "=== Pre-Deployment Validation ==="
          node validate-deployment.js
          echo ""
          echo "=== Critical Route Verification ==="
          node verify-routes.js

      - name: Clean SAM Build
        run: sam build --no-cached --parallel

  deploy:
    name: Deploy to AWS
    needs: [test, validate]
    runs-on: ubuntu-latest
    # Deployment requires ALL of:
    # 1. Manual workflow_dispatch trigger
    # 2. Explicit confirmation input = "deploy"
    # 3. Repository variable BNDY_SERVERLESS_DEPLOY_ENABLED = "true" (unset by default)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm_deploy == 'deploy' &&
      vars.BNDY_SERVERLESS_DEPLOY_ENABLED == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Lambda Dependencies
        run: |
          # Install production dependencies for each lambda
          for dir in *-lambda/; do
            if [[ -d "$dir" && -f "$dir/package.json" ]]; then
              echo "Installing dependencies in $dir"
              cd "$dir"
              npm install --production --legacy-peer-deps --ignore-scripts
              cd ..
            fi
          done

      - name: SAM Build
        run: sam build --parallel

      - name: SAM Deploy
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name bndy-serverless-api \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --s3-bucket bndy-deployment-artifacts-1758805276 \
            --s3-prefix bndy-serverless-api

      - name: Wait for API Gateway propagation
        run: sleep 10

      - name: Run Smoke Tests
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh
        env:
          API_URL: https://api.bndy.co.uk

      - name: Output Stack Info
        run: |
          aws cloudformation describe-stacks \
            --stack-name bndy-serverless-api \
            --query "Stacks[0].Outputs" \
            --output table

  capture_acceptance:
    name: One-shot Facebook Event Capture acceptance
    runs-on: ubuntu-latest
    # Explicitly frozen during infrastructure ownership reconciliation.
    # This job hot-deploys Capture code and must be redesigned as a separate reviewed workflow.
    if: ${{ false }}

    steps:
      - name: Checkout serverless API
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Capture implementation under test
        uses: actions/checkout@v4
        with:
          repository: flowency-live/bndy-enrichment
          ref: fix-staged-gsi-deploy
          path: enrichment

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Verify Capture implementation
        id: verify
        continue-on-error: true
        working-directory: enrichment
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run check

      - name: Bundle Capture processor
        id: bundle
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        working-directory: enrichment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/capture-lambda /tmp/capture-processor.zip
          mkdir -p /tmp/capture-lambda
          npx esbuild src/handlers/capture-processor.ts \
            --bundle --platform=node --target=node22 --format=cjs \
            --outfile=/tmp/capture-lambda/index.js
          cd /tmp/capture-lambda
          zip -q /tmp/capture-processor.zip index.js

      - name: Resolve production Capture credentials
        id: capture_auth
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          CAPTURE_FN=$(aws cloudformation describe-stacks \
            --stack-name bndy-capture --region eu-west-2 \
            --query "Stacks[0].Outputs[?OutputKey=='CaptureFunctionName'].OutputValue | [0]" --output text)
          CAPTURE_TOKEN=$(aws lambda get-function-configuration --region eu-west-2 \
            --function-name "$CAPTURE_FN" \
            --query 'Environment.Variables.CAPTURE_TOKEN' --output text)
          test -n "$CAPTURE_TOKEN" && test "$CAPTURE_TOKEN" != "None"
          echo "::add-mask::$CAPTURE_TOKEN"
          echo "CAPTURE_TOKEN=$CAPTURE_TOKEN" >> "$GITHUB_ENV"
          curl -fsS -H "Authorization: Bearer $CAPTURE_TOKEN" \
            'https://capture.bndy.co.uk/v1/captures/48c4ae2b-05be-4693-abea-b2dd126a1042' \
            > /tmp/capture-before.json

      - name: Hot-deploy processor code only
        id: hotdeploy
        if: steps.bundle.outcome == 'success' && steps.capture_auth.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          aws lambda update-function-code --region eu-west-2 \
            --function-name bndy-capture-processor \
            --zip-file fileb:///tmp/capture-processor.zip \
            > /tmp/update-code.json
          aws lambda wait function-updated --region eu-west-2 \
            --function-name bndy-capture-processor
          aws lambda get-function-configuration --region eu-west-2 \
            --function-name bndy-capture-processor \
            --query '{LastModified:LastModified,CodeSha256:CodeSha256,Runtime:Runtime,State:State,LastUpdateStatus:LastUpdateStatus}' \
            --output json > /tmp/processor-config.json

      - name: Replay exact Facebook Event Capture
        id: replay
        if: steps.hotdeploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          CAPTURE_ID='48c4ae2b-05be-4693-abea-b2dd126a1042'

          GEMINI_SECRET_ARN=$(aws lambda get-function-configuration --region eu-west-2 \
            --function-name bndy-capture-processor \
            --query 'Environment.Variables.GEMINI_SECRET_ARN' --output text)
          test -n "$GEMINI_SECRET_ARN" && test "$GEMINI_SECRET_ARN" != "None"
          SECRET_STRING=$(aws secretsmanager get-secret-value --region eu-west-2 \
            --secret-id "$GEMINI_SECRET_ARN" --query SecretString --output text)
          node -e 'const s=JSON.parse(process.argv[1]); if(!(s.apiKey||s.GEMINI_API_KEY)) process.exit(1)' "$SECRET_STRING"
          unset SECRET_STRING

          curl -fsS -X PATCH \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $CAPTURE_TOKEN" \
            -d '{"status":"unprocessed"}' \
            "https://capture.bndy.co.uk/v1/captures/$CAPTURE_ID/status" > /tmp/reset.json

          aws lambda invoke --region eu-west-2 \
            --function-name bndy-capture-scan \
            --cli-binary-format raw-in-base64-out --payload '{}' \
            /tmp/scanner.json >/tmp/scanner-meta.json

          for i in $(seq 1 42); do
            curl -fsS -H "Authorization: Bearer $CAPTURE_TOKEN" \
              "https://capture.bndy.co.uk/v1/captures/$CAPTURE_ID" > /tmp/capture-after.json
            STATUS=$(jq -r '.capture.status // .status // empty' /tmp/capture-after.json)
            echo "poll=$i status=$STATUS"
            if [ -n "$STATUS" ] && [ "$STATUS" != "unprocessed" ] && [ "$STATUS" != "processing" ]; then
              break
            fi
            sleep 10
          done

      - name: Record sanitized result on non-triggering branch
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          BUNDLE_OUTCOME: ${{ steps.bundle.outcome }}
          AUTH_OUTCOME: ${{ steps.capture_auth.outcome }}
          HOTDEPLOY_OUTCOME: ${{ steps.hotdeploy.outcome }}
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
        shell: bash
        run: |
          set -u
          mkdir -p diagnostics
          CAPTURE_ID='48c4ae2b-05be-4693-abea-b2dd126a1042'

          if [ -n "${CAPTURE_TOKEN:-}" ]; then
            curl -fsS -H "Authorization: Bearer $CAPTURE_TOKEN" \
              "https://capture.bndy.co.uk/v1/captures/$CAPTURE_ID" > /tmp/capture-final.json || true
          fi
          [ -s /tmp/capture-before.json ] || echo '{}' > /tmp/capture-before.json
          [ -s /tmp/capture-final.json ] || cp /tmp/capture-after.json /tmp/capture-final.json 2>/dev/null || cp /tmp/capture-before.json /tmp/capture-final.json 2>/dev/null || echo '{}' > /tmp/capture-final.json
          [ -s /tmp/processor-config.json ] || aws lambda get-function-configuration --region eu-west-2 \
            --function-name bndy-capture-processor \
            --query '{LastModified:LastModified,CodeSha256:CodeSha256,Runtime:Runtime,State:State,LastUpdateStatus:LastUpdateStatus}' \
            --output json > /tmp/processor-config.json 2>/dev/null || echo '{}' > /tmp/processor-config.json

          if command -v aws >/dev/null 2>&1; then
            aws logs filter-log-events --region eu-west-2 \
              --log-group-name '/aws/lambda/bndy-capture-processor' \
              --start-time "$(( ($(date +%s) - 3600) * 1000 ))" \
              --filter-pattern "$CAPTURE_ID" \
              --query 'events[].message' --output json \
              > /tmp/processor-logs.json 2>/dev/null || echo '[]' > /tmp/processor-logs.json
          else
            echo '[]' > /tmp/processor-logs.json
          fi

          jq -n \
            --arg inspectedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg captureId "$CAPTURE_ID" \
            --arg verify "$VERIFY_OUTCOME" \
            --arg bundle "$BUNDLE_OUTCOME" \
            --arg auth "$AUTH_OUTCOME" \
            --arg hotdeploy "$HOTDEPLOY_OUTCOME" \
            --arg replay "$REPLAY_OUTCOME" \
            --argjson before "$(jq '.capture // .' /tmp/capture-before.json)" \
            --argjson final "$(jq '.capture // .' /tmp/capture-final.json)" \
            --argjson processor "$(cat /tmp/processor-config.json)" \
            --argjson processorLogs "$(cat /tmp/processor-logs.json)" \
            '{result:"CAPTURE_ACCEPTANCE_VIA_DEPLOY",inspectedAt:$inspectedAt,captureId:$captureId,steps:{verify:$verify,bundle:$bundle,auth:$auth,hotdeploy:$hotdeploy,replay:$replay},before:{status:$before.status,sharedUrl:$before.sharedUrl,note:$before.note,processingAttempt:$before.processingAttempt},final:{status:$final.status,sharedUrl:$final.sharedUrl,note:$final.note,processingAttempt:$final.processingAttempt},processor:$processor,processorLogs:$processorLogs}' \
            > diagnostics/capture-facebook-event-via-deploy.json

          git config user.name 'bndy-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add diagnostics/capture-facebook-event-via-deploy.json
          git commit -m 'Record Capture Facebook Event acceptance result' || exit 0
          git push --force origin HEAD:capture-acceptance-results
