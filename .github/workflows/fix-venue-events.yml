name: fix-venue-events-endpoint

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fix-venue-events.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Patch venue events endpoint
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('events-lambda/handlers/public.js')
          text = path.read_text()

          old = '''async function handleGetVenueEvents(deps, event) {
            const { dynamodb, getCorsHeaders } = deps;
            const { venueId } = event.pathParameters;
            const { startDate, endDate } = event.queryStringParameters || {};

            if (!startDate || !endDate) {
              return {
                statusCode: 400,
                headers: getCorsHeaders(event),
                body: JSON.stringify({ error: 'startDate and endDate required' })
              };
            }

            console.log('VENUE_EVENTS: Query received', { venueId, startDate, endDate });

            // Query events by venueId
            const result = await dynamodb.query({
              TableName: EVENTS_TABLE,
              IndexName: 'venueId-date-index',
              KeyConditionExpression: 'venueId = :venueId AND #date BETWEEN :start AND :end',
              FilterExpression: 'isPublic = :isPublic',
              ExpressionAttributeNames: { '#date': 'date' },
              ExpressionAttributeValues: {
                ':venueId': venueId,
                ':start': startDate,
                ':end': endDate,
                ':isPublic': true
              }
            }).promise();'''

          new = '''async function handleGetVenueEvents(deps, event) {
            const { dynamodb, getCorsHeaders } = deps;
            const { venueId } = event.pathParameters;
            const { startDate } = event.queryStringParameters || {};
            const start = startDate || new Date().toISOString().split('T')[0];

            console.log('VENUE_EVENTS: Query received', { venueId, startDate: start });

            // Query all public events for the venue from startDate onwards.
            // There is deliberately no end date for an upcoming-events feed.
            const result = await dynamodb.query({
              TableName: EVENTS_TABLE,
              IndexName: 'venueId-date-index',
              KeyConditionExpression: 'venueId = :venueId AND #date >= :start',
              FilterExpression: 'isPublic = :isPublic',
              ExpressionAttributeNames: { '#date': 'date' },
              ExpressionAttributeValues: {
                ':venueId': venueId,
                ':start': start,
                ':isPublic': true
              }
            }).promise();'''

          if old not in text:
              raise SystemExit('Expected venue-events block not found; refusing to patch')

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit endpoint fix
        run: |
          git config user.name "bndy-automation"
          git config user.email "actions@users.noreply.github.com"
          git add events-lambda/handlers/public.js
          git diff --cached --check
          git commit -m "Fix venue events upcoming query contract"
          git push origin master
