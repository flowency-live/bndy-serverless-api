name: Deploy Source Inspector

on:
  workflow_run:
    workflows: ["Deploy BNDY API"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  AWS_REGION: eu-west-2
  NODE_VERSION: '20'
  SAM_CLI_TELEMETRY: '0'
  DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: Deploy source inspector companion stack
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: artists-lambda/package-lock.json

      - name: Install source inspector test dependencies
        working-directory: artists-lambda
        run: npm ci --legacy-peer-deps

      - name: Test source inspector
        working-directory: artists-lambda
        run: node --test source-inspector.test.js source-inspector-v2.test.js

      - name: Verify shared identity copies
        run: node shared/identity/check-sync.test.js

      - name: Keep production dependencies only
        working-directory: artists-lambda
        run: npm prune --omit=dev --ignore-scripts

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve existing BNDY HTTP API
        shell: bash
        run: |
          set -euo pipefail
          API_ID=$(aws cloudformation describe-stacks \
            --stack-name bndy-serverless-api \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='BndyHttpApiId'].OutputValue | [0]" \
            --output text)
          test -n "$API_ID" && test "$API_ID" != "None"
          echo "BNDY_HTTP_API_ID=$API_ID" >> "$GITHUB_ENV"

      - name: SAM Build
        run: |
          sam build \
            --template-file source-inspector-template.yaml \
            --build-dir .aws-sam-source-inspector

      - name: SAM Deploy Lambda companion
        run: |
          sam deploy \
            --template-file .aws-sam-source-inspector/template.yaml \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name bndy-source-inspector \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM \
            --s3-bucket bndy-deployment-artifacts-1758805276 \
            --s3-prefix bndy-source-inspector \
            --parameter-overrides BndyHttpApiId="$BNDY_HTTP_API_ID"

      - name: Reconcile API Gateway integration and route
        shell: bash
        run: |
          set -euo pipefail
          ROUTE_KEY='POST /api/community/source/inspect'
          FUNCTION_ARN=$(aws cloudformation describe-stacks \
            --stack-name bndy-source-inspector \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='SourceInspectorFunctionArn'].OutputValue | [0]" \
            --output text)
          test -n "$FUNCTION_ARN" && test "$FUNCTION_ARN" != "None"

          # The main SAM stack owns the HttpApi definition and may replace its
          # route set. Reconcile this companion integration explicitly rather
          # than trusting CloudFormation state that can be stale after that.
          while IFS= read -r route_id; do
            [ -n "$route_id" ] || continue
            aws apigatewayv2 delete-route \
              --api-id "$BNDY_HTTP_API_ID" \
              --route-id "$route_id" \
              --region "$AWS_REGION" || true
          done < <(aws apigatewayv2 get-routes \
            --api-id "$BNDY_HTTP_API_ID" \
            --region "$AWS_REGION" \
            --output json | jq -r --arg key "$ROUTE_KEY" '.Items[]? | select(.RouteKey == $key) | .RouteId')

          while IFS= read -r integration_id; do
            [ -n "$integration_id" ] || continue
            aws apigatewayv2 delete-integration \
              --api-id "$BNDY_HTTP_API_ID" \
              --integration-id "$integration_id" \
              --region "$AWS_REGION" || true
          done < <(aws apigatewayv2 get-integrations \
            --api-id "$BNDY_HTTP_API_ID" \
            --region "$AWS_REGION" \
            --output json | jq -r --arg uri "$FUNCTION_ARN" '.Items[]? | select(.IntegrationUri == $uri) | .IntegrationId')

          INTEGRATION_ID=$(aws apigatewayv2 create-integration \
            --api-id "$BNDY_HTTP_API_ID" \
            --integration-type AWS_PROXY \
            --integration-uri "$FUNCTION_ARN" \
            --payload-format-version '2.0' \
            --timeout-in-millis 8000 \
            --region "$AWS_REGION" \
            --query IntegrationId \
            --output text)
          test -n "$INTEGRATION_ID" && test "$INTEGRATION_ID" != "None"

          ROUTE_ID=$(aws apigatewayv2 create-route \
            --api-id "$BNDY_HTTP_API_ID" \
            --route-key "$ROUTE_KEY" \
            --target "integrations/$INTEGRATION_ID" \
            --region "$AWS_REGION" \
            --query RouteId \
            --output text)
          test -n "$ROUTE_ID" && test "$ROUTE_ID" != "None"
          echo "Reconciled $ROUTE_KEY -> integrations/$INTEGRATION_ID ($ROUTE_ID)"

      - name: Wait for API Gateway propagation
        run: sleep 5

      - name: Smoke test source inspector route and browser CORS
        shell: bash
        run: |
          set -euo pipefail
          URL='https://api.bndy.co.uk/api/community/source/inspect'
          ORIGIN='https://map.bndy.co.uk'

          status=$(curl -sS -D /tmp/source-inspector-empty.headers -o /tmp/source-inspector-empty.json -w '%{http_code}' \
            -X POST "$URL" \
            -H "Origin: $ORIGIN" \
            -H 'content-type: application/json' \
            --data '{"input":""}')
          test "$status" = "400"
          grep -q 'INPUT_REQUIRED' /tmp/source-inspector-empty.json
          tr -d '\r' < /tmp/source-inspector-empty.headers | grep -qi "^access-control-allow-origin: $ORIGIN$"

          status=$(curl -sS -D /tmp/source-inspector-preflight.headers -o /dev/null -w '%{http_code}' \
            -X OPTIONS "$URL" \
            -H "Origin: $ORIGIN" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type')
          case "$status" in 200|204) ;; *) echo "Unexpected preflight status: $status"; exit 1 ;; esac
          tr -d '\r' < /tmp/source-inspector-preflight.headers | grep -qi "^access-control-allow-origin: $ORIGIN$"

          status=$(curl -sS -o /tmp/source-inspector-host.json -w '%{http_code}' \
            -X POST "$URL" \
            -H 'content-type: application/json' \
            --data '{"input":"https://evil.example/facebook.com/not-a-page"}')
          test "$status" = "422"
          grep -q 'NOT_FACEBOOK_URL' /tmp/source-inspector-host.json

      - name: Mark source inspector deployment successful
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$DEPLOY_SHA" \
            -d '{"state":"success","context":"source-inspector/deploy","description":"Inspector route reconciled after main deploy; browser CORS smoke passed"}'

      - name: Mark source inspector deployment failed
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$DEPLOY_SHA" \
            -d '{"state":"failure","context":"source-inspector/deploy","description":"Inspector reconcile, deploy or browser CORS smoke failed"}'
