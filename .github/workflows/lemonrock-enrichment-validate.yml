name: Validate Lemonrock enrichment main

on:
  push:
    branches: [ops/lemonrock-prod-deploy]

permissions:
  contents: write

jobs:
  validate:
    if: contains(github.event.head_commit.message, 'Validate Lemonrock enrichment main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/lemonrock-prod-deploy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate current enrichment main
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/flowency-live/bndy-enrichment.git /tmp/bndy-enrichment
          cd /tmp/bndy-enrichment
          SHA=$(git rev-parse HEAD)
          npm install
          npm run check
          npx cdk synth >/tmp/cdk-synth.log
          printf '{"status":"success","validatedAt":"%s","enrichmentSha":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$SHA" > "$GITHUB_WORKSPACE/ops/lemonrock-enrichment-validation.json"
      - name: Publish validation
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f ops/lemonrock-enrichment-validation.json ]; then
            printf '{"status":"failure","validatedAt":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ops/lemonrock-enrichment-validation.json
          fi
          git config user.name "bndy-backline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ops/lemonrock-enrichment-validation.json
          git commit -m 'Record Lemonrock enrichment validation' || true
          git pull --rebase --autostash origin ops/lemonrock-prod-deploy
          git push origin HEAD:ops/lemonrock-prod-deploy
