name: Inspect Lemonrock live ingestion

on:
  push:
    branches: [ops/lemonrock-prod-deploy]

permissions:
  contents: write

jobs:
  inspect:
    if: contains(github.event.head_commit.message, 'Inspect Lemonrock live ingestion')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/lemonrock-prod-deploy
      - name: Publish inspect run start
        run: |
          set -euo pipefail
          mkdir -p ops
          printf '{"phase":"started","runId":"%s","sha":"%s","startedAt":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ops/lemonrock-live-inspect-run.json
          git config user.name "bndy-backline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ops/lemonrock-live-inspect-run.json
          git commit -m "Record Lemonrock live inspect start"
          git pull --rebase --autostash origin ops/lemonrock-prod-deploy
          git push origin HEAD:ops/lemonrock-prod-deploy
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2
      - name: Publish live state
        run: |
          set -euo pipefail
          TABLE=$(aws cloudformation describe-stacks --stack-name BndyEnrichmentStack --query "Stacks[0].Outputs[?OutputKey=='StateTableName'].OutputValue | [0]" --output text)
          QUEUE_URL=$(aws cloudformation describe-stacks --stack-name BndyEnrichmentStack --query "Stacks[0].Outputs[?OutputKey=='SourceScanQueueUrl'].OutputValue | [0]" --output text)
          WORKER=$(aws cloudformation describe-stacks --stack-name BndyEnrichmentStack --query "Stacks[0].Outputs[?OutputKey=='SourceWorkerFunctionName'].OutputValue | [0]" --output text)
          aws dynamodb query --table-name "$TABLE" --key-condition-expression "pk = :pk AND begins_with(sk, :prefix)" --expression-attribute-values '{":pk":{"S":"BOOTSTRAP#lemonrock"},":prefix":{"S":"TASK#"}}' --output json > /tmp/tasks.json
          aws dynamodb scan --table-name "$TABLE" --filter-expression "begins_with(pk, :p) AND sk = :sk" --expression-attribute-values '{":p":{"S":"SOURCE#lemonrock"},":sk":{"S":"CONFIG"}}' --output json > /tmp/sources.json
          export TABLE
          node - <<'NODE' > /tmp/observations.json
          const { execFileSync } = require('child_process');
          const sources = ['lemonrock-artist-index','lemonrock-venue-index','lemonrock-artist-hydration','lemonrock-venue-hydration','lemonrock-gig-hydration','lemonrock-future-reconcile','lemonrock-new-gigs','lemonrock-cancellations','lemonrock-full-reconcile'];
          const out = {};
          for (const source of sources) {
            const values = JSON.stringify({':pk':{S:`SOURCE#${source}`}});
            const raw = execFileSync('aws',['dynamodb','query','--table-name',process.env.TABLE,'--index-name','ObservationClaimsIndex','--key-condition-expression','GSI1PK = :pk','--expression-attribute-values',values,'--select','COUNT','--output','json'],{encoding:'utf8'});
            out[source] = JSON.parse(raw).Count || 0;
          }
          console.log(JSON.stringify(out));
          NODE
          TASK_COUNT=$(jq '.Count // 0' /tmp/tasks.json)
          TASK_STATUS=$(jq -c '[.Items[]?.status.S] | sort | group_by(.) | map({(.[0]):length}) | add // {}' /tmp/tasks.json)
          SOURCE_SUMMARY=$(jq -c '[.Items[] | {id:.id.S,enabled:(.enabled.BOOL//false),shadow:(.shadow.BOOL//false),health:(.health.S//"unknown")}]' /tmp/sources.json)
          OBS=$(cat /tmp/observations.json)
          QUEUE=$(aws sqs get-queue-attributes --queue-url "$QUEUE_URL" --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible ApproximateNumberOfMessagesDelayed)
          INDEXES=$(aws dynamodb describe-table --table-name "$TABLE" --query 'Table.GlobalSecondaryIndexes[].{IndexName:IndexName,IndexStatus:IndexStatus}')
          RULES=$(aws events list-rules --name-prefix BndyEnrichmentStack-Lemonrock --query 'Rules[].{Name:Name,State:State,ScheduleExpression:ScheduleExpression}')
          START=$(date -u -d '15 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          INV=$(aws cloudwatch get-metric-statistics --namespace AWS/Lambda --metric-name Invocations --dimensions Name=FunctionName,Value="$WORKER" --start-time "$START" --end-time "$END" --period 900 --statistics Sum --query 'Datapoints[0].Sum' --output text 2>/dev/null || echo 0)
          ERR=$(aws cloudwatch get-metric-statistics --namespace AWS/Lambda --metric-name Errors --dimensions Name=FunctionName,Value="$WORKER" --start-time "$START" --end-time "$END" --period 900 --statistics Sum --query 'Datapoints[0].Sum' --output text 2>/dev/null || echo 0)
          [ "$INV" = "None" ] && INV=0
          [ "$ERR" = "None" ] && ERR=0
          mkdir -p ops
          jq -n \
            --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg table "$TABLE" --arg worker "$WORKER" \
            --argjson taskCount "$TASK_COUNT" --argjson taskStatus "$TASK_STATUS" \
            --argjson sources "$SOURCE_SUMMARY" --argjson observations "$OBS" \
            --argjson queue "$QUEUE" --argjson indexes "$INDEXES" --argjson rules "$RULES" \
            --arg inv "$INV" --arg err "$ERR" \
            '{verifiedAt:$verifiedAt,stateTable:$table,sourceWorker:$worker,indexes:$indexes,taskCount:$taskCount,taskStatusCounts:$taskStatus,sources:$sources,observations:$observations,queue:$queue.Attributes,eventRules:$rules,workerInvocations15m:($inv|tonumber),workerErrors15m:($err|tonumber)}' > ops/lemonrock-live-state.json
          cat ops/lemonrock-live-state.json
          printf '{"phase":"finished","status":"success","runId":"%s","finishedAt":"%s"}\n' "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ops/lemonrock-live-inspect-run.json
          git config user.name "bndy-backline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ops/lemonrock-live-state.json ops/lemonrock-live-inspect-run.json
          git commit -m "Record Lemonrock live ingestion state" || true
          git pull --rebase --autostash origin ops/lemonrock-prod-deploy
          git push origin HEAD:ops/lemonrock-prod-deploy
