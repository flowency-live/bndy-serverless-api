name: Verify Claim stream once
on:
  push:
    branches: [claim-v2-stream-verify]
permissions:
  contents: read
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[verify-claim-stream]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2
      - name: Verify production stream and SSM pointer
        shell: bash
        run: |
          set -euo pipefail
          STREAM=$(aws dynamodb describe-table --table-name bndy-entity-claims --query 'Table.LatestStreamArn' --output text)
          POINTER=$(aws ssm get-parameter --name /bndy/claims/stream-arn --query 'Parameter.Value' --output text)
          test -n "$STREAM" && test "$STREAM" != "None"
          test "$STREAM" = "$POINTER"
          echo "claim_stream=enabled"
          echo "ssm_pointer=matches"
