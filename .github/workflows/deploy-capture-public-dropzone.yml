name: Deploy Capture public Dropzone transport

on:
  push:
    branches:
      - deploy-capture-public-dropzone
    paths:
      - '.github/workflows/deploy-capture-public-dropzone.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ops branch
        uses: actions/checkout@v4
        with:
          path: ops
          ref: deploy-capture-public-dropzone

      - name: Checkout Capture
        uses: actions/checkout@v4
        with:
          repository: flowency-live/bndy-capture
          ref: main
          path: capture

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - uses: aws-actions/setup-sam@v2

      - name: Resolve existing stack parameters
        id: params
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_JSON="$(aws secretsmanager get-secret-value --secret-id bndy/capture-service --query SecretString --output text)"
          CAPTURE_TOKEN="$(jq -r '.token // .CAPTURE_TOKEN' <<<"$TOKEN_JSON")"
          HOSTED_ZONE_ID="$(aws cloudformation describe-stacks --stack-name bndy-capture --query "Stacks[0].Parameters[?ParameterKey=='HostedZoneId'].ParameterValue | [0]" --output text)"
          test -n "$CAPTURE_TOKEN" && test "$CAPTURE_TOKEN" != "null"
          test -n "$HOSTED_ZONE_ID" && test "$HOSTED_ZONE_ID" != "None"
          echo "CAPTURE_TOKEN=$CAPTURE_TOKEN" >> "$GITHUB_ENV"
          echo "HOSTED_ZONE_ID=$HOSTED_ZONE_ID" >> "$GITHUB_ENV"
          echo "::add-mask::$CAPTURE_TOKEN"
          echo "::add-mask::$HOSTED_ZONE_ID"

      - name: Build
        id: build
        if: steps.params.outcome == 'success'
        continue-on-error: true
        working-directory: capture/aws
        run: sam build

      - name: Deploy
        id: deploy
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: capture/aws
        shell: bash
        run: |
          set -o pipefail
          sam deploy \
            --stack-name bndy-capture \
            --region eu-west-2 \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              CaptureToken="$CAPTURE_TOKEN" \
              DomainName="capture.bndy.co.uk" \
              HostedZoneId="$HOSTED_ZONE_ID" \
              AllowedOrigin="*" \
              PublicAllowedOrigins="https://chat.bndy.live" \
              PublicRateLimit="20" \
              PublicRateWindowSeconds="600" \
              PublicMaxImageBytes="5242880" 2>&1 | tee /tmp/capture-deploy.log

      - name: Smoke test public transport
        id: smoke
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="$(curl --fail --silent --show-error https://capture.bndy.co.uk/health)"
          jq -e '.ok == true' <<<"$HEALTH"

          BAD_ORIGIN_STATUS="$(curl --silent --output /tmp/bad-origin.json --write-out '%{http_code}' \
            -X POST https://capture.bndy.co.uk/v1/public/captures \
            -H 'Origin: https://example.com' \
            -H 'Content-Type: application/json' \
            --data '{"sharedText":"test"}')"
          test "$BAD_ORIGIN_STATUS" = "403"

          BAD_SIZE_STATUS="$(curl --silent --output /tmp/bad-size.json --write-out '%{http_code}' \
            -X POST https://capture.bndy.co.uk/v1/public/uploads/image \
            -H 'Origin: https://chat.bndy.live' \
            -H 'Content-Type: application/json' \
            --data '{"mimeType":"image/jpeg","fileName":"test.jpg","size":0}')"
          test "$BAD_SIZE_STATUS" = "400"
          jq -e '.error == "invalid_image_size"' /tmp/bad-size.json
          echo "bad_origin_status=$BAD_ORIGIN_STATUS" >> "$GITHUB_OUTPUT"
          echo "bad_size_status=$BAD_SIZE_STATUS" >> "$GITHUB_OUTPUT"

      - name: Record result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/diagnostics
          ERROR_TEXT=""
          if [ -f /tmp/capture-deploy.log ]; then
            ERROR_TEXT="$(grep -E 'Error|error|FAILED|failed|ROLLBACK|AccessDenied|ValidationError' /tmp/capture-deploy.log | tail -20 | sed 's/"/\\"/g' | tr '\n' ' ' || true)"
          fi
          cat > ops/diagnostics/public-dropzone-deploy.json <<JSON
          {
            "captureCommit": "$(git -C capture rev-parse HEAD)",
            "recordedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "paramsOutcome": "${{ steps.params.outcome }}",
            "buildOutcome": "${{ steps.build.outcome }}",
            "deployOutcome": "${{ steps.deploy.outcome }}",
            "smokeOutcome": "${{ steps.smoke.outcome }}",
            "badOriginStatus": "${{ steps.smoke.outputs.bad_origin_status }}",
            "badImageSizeStatus": "${{ steps.smoke.outputs.bad_size_status }}",
            "errorSummary": "$ERROR_TEXT"
          }
          JSON
          git -C ops config user.name bndy-bot
          git -C ops config user.email actions@users.noreply.github.com
          git -C ops add diagnostics/public-dropzone-deploy.json
          git -C ops commit -m 'Record Capture public Dropzone deployment' || true
          git -C ops push origin HEAD:deploy-capture-public-dropzone

      - name: Fail unsuccessful deployment
        if: always() && (steps.params.outcome != 'success' || steps.build.outcome != 'success' || steps.deploy.outcome != 'success' || steps.smoke.outcome != 'success')
        run: exit 1

# deploy trigger: resolved gig details
