name: Hot-deploy current Capture processor

on:
  push:
    branches:
      - dropzone-poster-diagnostic
    paths:
      - '.github/workflows/hotdeploy-enrichment-main.yml'

permissions:
  contents: write

jobs:
  deploy-and-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dropzone-poster-diagnostic
          path: ops

      - uses: actions/checkout@v4
        with:
          repository: flowency-live/bndy-enrichment
          ref: main
          path: enrichment

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Verify and bundle current enrichment main
        working-directory: enrichment
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          rm -rf /tmp/capture-lambda /tmp/capture-processor.zip
          mkdir -p /tmp/capture-lambda
          npx esbuild src/handlers/capture-processor.ts --bundle --platform=node --target=node22 --format=cjs --outfile=/tmp/capture-lambda/index.js
          cd /tmp/capture-lambda
          zip -q /tmp/capture-processor.zip index.js

      - name: Deploy processor code
        shell: bash
        run: |
          set -euo pipefail
          aws lambda update-function-code --function-name bndy-capture-processor --zip-file fileb:///tmp/capture-processor.zip >/tmp/update.json
          aws lambda wait function-updated --function-name bndy-capture-processor
          aws lambda get-function-configuration --function-name bndy-capture-processor --query '{LastModified:LastModified,CodeSha256:CodeSha256,Runtime:Runtime,State:State,LastUpdateStatus:LastUpdateStatus}' --output json >/tmp/config.json

      - name: Resolve Capture token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_JSON="$(aws secretsmanager get-secret-value --secret-id bndy/capture-service --query SecretString --output text)"
          CAPTURE_TOKEN="$(jq -r '.token // .CAPTURE_TOKEN' <<<"$TOKEN_JSON")"
          test -n "$CAPTURE_TOKEN" && test "$CAPTURE_TOKEN" != "null"
          echo "CAPTURE_TOKEN=$CAPTURE_TOKEN" >> "$GITHUB_ENV"
          echo "::add-mask::$CAPTURE_TOKEN"

      - name: Replay failed public poster capture
        shell: bash
        run: |
          set -euo pipefail
          ID=e106ed9f-ecde-4ad5-a4ee-07ed315732e4
          curl -fsS -X PATCH -H 'Content-Type: application/json' -H "Authorization: Bearer $CAPTURE_TOKEN" -d '{"status":"unprocessed"}' "https://capture.bndy.co.uk/v1/captures/$ID/status" >/tmp/reset.json
          aws lambda invoke --function-name bndy-capture-scan --payload '{}' --cli-binary-format raw-in-base64-out /tmp/scan.json >/dev/null
          for i in $(seq 1 60); do
            curl -fsS -H "Authorization: Bearer $CAPTURE_TOKEN" "https://capture.bndy.co.uk/v1/captures/$ID" >/tmp/capture.json
            STATUS=$(jq -r '.status // .capture.status // empty' /tmp/capture.json)
            echo "poll=$i status=$STATUS"
            if [ "$STATUS" != "unprocessed" ] && [ "$STATUS" != "processing" ] && [ -n "$STATUS" ]; then break; fi
            sleep 5
          done

      - name: Record sanitized result
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p ops/diagnostics
          python - <<'PY'
          import json, pathlib, datetime, subprocess
          c=json.loads(pathlib.Path('/tmp/capture.json').read_text()) if pathlib.Path('/tmp/capture.json').exists() else {}
          c=c.get('capture',c)
          note=str(c.get('note') or '')
          cfg=json.loads(pathlib.Path('/tmp/config.json').read_text()) if pathlib.Path('/tmp/config.json').exists() else {}
          try:
              commit=subprocess.check_output(['git','-C','enrichment','rev-parse','HEAD'],text=True).strip()
          except Exception:
              commit=None
          safe={
            'recordedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'enrichmentCommit':commit,
            'processor':cfg,
            'capture':{
              'id':c.get('id'),'status':c.get('status'),'sourceApp':c.get('sourceApp'),'processingAttempt':c.get('processingAttempt'),
              'media':{'type':(c.get('media') or {}).get('type'),'mimeType':(c.get('media') or {}).get('mimeType'),'hasBucket':bool((c.get('media') or {}).get('bucket')),'hasKey':bool((c.get('media') or {}).get('key'))},
              'noteLines':[x[:1000] for x in note.splitlines() if x.strip()]
            }
          }
          pathlib.Path('ops/diagnostics/dropzone-poster-main-replay.json').write_text(json.dumps(safe,indent=2))
          PY
          git -C ops config user.name bndy-bot
          git -C ops config user.email actions@users.noreply.github.com
          git -C ops add diagnostics/dropzone-poster-main-replay.json
          git -C ops commit -m 'Record current processor poster replay' || true
          git -C ops push origin HEAD:dropzone-poster-diagnostic
