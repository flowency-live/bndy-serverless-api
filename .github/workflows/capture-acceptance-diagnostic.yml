name: capture-acceptance-diagnostic

on:
  push:
    branches: [capture-acceptance-diagnostic]
    paths:
      - '.github/workflows/capture-acceptance-diagnostic.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capture-acceptance-diagnostic

      - name: Configure AWS credentials
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Inspect exact Capture
        if: always()
        env:
          AWS_OUTCOME: ${{ steps.aws.outcome }}
          HAS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          HAS_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}
        shell: bash
        run: |
          set -u
          mkdir -p diagnostics

          if [ "$AWS_OUTCOME" != "success" ]; then
            jq -n \
              --arg inspectedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg awsOutcome "$AWS_OUTCOME" \
              --arg hasAccessKey "$HAS_ACCESS_KEY" \
              --arg hasSecretKey "$HAS_SECRET_KEY" \
              '{result:"AWS_AUTH_BLOCKER",inspectedAt:$inspectedAt,awsOutcome:$awsOutcome,hasAccessKey:($hasAccessKey=="true"),hasSecretKey:($hasSecretKey=="true")}' \
              > diagnostics/capture-facebook-event.json
          else
            set -e
            CAPTURE_FN=$(aws cloudformation describe-stacks --stack-name bndy-capture --region eu-west-2 \
              --query "Stacks[0].Outputs[?OutputKey=='CaptureFunctionName'].OutputValue | [0]" --output text)
            CAPTURE_TOKEN=$(aws lambda get-function-configuration --region eu-west-2 --function-name "$CAPTURE_FN" \
              --query 'Environment.Variables.CAPTURE_TOKEN' --output text)
            echo "::add-mask::$CAPTURE_TOKEN"

            curl -fsS -H "Authorization: Bearer $CAPTURE_TOKEN" \
              'https://capture.bndy.co.uk/v1/captures?limit=100' > /tmp/captures.json

            CAPTURE_ID=$(jq -r '
              (.captures // .items // . // [])
              | map(select(
                  ((.sharedUrl // "") | contains("gwHFuwf71")) or
                  ((.sharedUrl // "") | contains("1555240929628880")) or
                  ((.sharedText // "") | contains("gwHFuwf71")) or
                  ((.sharedText // "") | contains("1555240929628880"))
                ))
              | sort_by(.receivedAt // .capturedAt // "") | reverse | .[0].id // empty
            ' /tmp/captures.json)

            if [ -z "$CAPTURE_ID" ]; then
              jq '{result:"NO_MATCHING_CAPTURE",inspectedAt:(now|todateiso8601),recentCaptures:((.captures // .items // . // [])[0:15] | map({id,capturedAt,receivedAt,status,sharedUrl,sharedText,mimeType,sourceApp,note}))}' \
                /tmp/captures.json > diagnostics/capture-facebook-event.json
            else
              curl -fsS -H "Authorization: Bearer $CAPTURE_TOKEN" \
                "https://capture.bndy.co.uk/v1/captures/$CAPTURE_ID" > /tmp/capture-before.json

              BEFORE_STATUS=$(jq -r '.capture.status // .status // empty' /tmp/capture-before.json)
              if [ "$BEFORE_STATUS" = "unprocessed" ]; then
                aws lambda invoke --region eu-west-2 --function-name bndy-capture-scan \
                  --cli-binary-format raw-in-base64-out --payload '{}' /tmp/scanner.json >/dev/null || true
                sleep 20
              fi

              curl -fsS -H "Authorization: Bearer $CAPTURE_TOKEN" \
                "https://capture.bndy.co.uk/v1/captures/$CAPTURE_ID" > /tmp/capture-after.json

              PROCESSOR_CONFIG=$(aws lambda get-function-configuration --region eu-west-2 \
                --function-name bndy-capture-processor \
                --query '{LastModified:LastModified,CodeSha256:CodeSha256,Runtime:Runtime,State:State,LastUpdateStatus:LastUpdateStatus}' \
                --output json 2>/dev/null || echo '{}')

              jq -n \
                --arg inspectedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg captureId "$CAPTURE_ID" \
                --argjson before "$(jq '.capture // .' /tmp/capture-before.json)" \
                --argjson after "$(jq '.capture // .' /tmp/capture-after.json)" \
                --argjson processor "$PROCESSOR_CONFIG" \
                '{result:"MATCHED_CAPTURE",inspectedAt:$inspectedAt,captureId:$captureId,before:{id:$before.id,capturedAt:$before.capturedAt,receivedAt:$before.receivedAt,updatedAt:$before.updatedAt,status:$before.status,sharedUrl:$before.sharedUrl,sharedText:$before.sharedText,mimeType:$before.mimeType,sourceApp:$before.sourceApp,suggestedEntityType:$before.suggestedEntityType,note:$before.note,processingAttempt:$before.processingAttempt,processingWorkerId:$before.processingWorkerId,leaseUntil:$before.leaseUntil},after:{id:$after.id,capturedAt:$after.capturedAt,receivedAt:$after.receivedAt,updatedAt:$after.updatedAt,status:$after.status,sharedUrl:$after.sharedUrl,sharedText:$after.sharedText,mimeType:$after.mimeType,sourceApp:$after.sourceApp,suggestedEntityType:$after.suggestedEntityType,note:$after.note,processingAttempt:$after.processingAttempt,processingWorkerId:$after.processingWorkerId,leaseUntil:$after.leaseUntil},processor:$processor}' \
                > diagnostics/capture-facebook-event.json
            fi
          fi

          git config user.name 'bndy-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add diagnostics/capture-facebook-event.json
          git commit -m 'Record Facebook Event Capture production diagnostic' || exit 0
          git push origin HEAD:capture-acceptance-diagnostic
