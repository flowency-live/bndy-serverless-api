name: Inspect canonical BNDY corpus

on:
  push:
    branches: [ops/lemonrock-prod-deploy]

permissions:
  contents: write

jobs:
  inspect:
    if: contains(github.event.head_commit.message, 'Inspect canonical BNDY corpus')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/lemonrock-prod-deploy
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2
      - name: Inspect production canonical tables
        run: |
          set -euo pipefail
          mkdir -p ops
          inspect_table() {
            local name="$1"
            DESC=$(aws dynamodb describe-table --table-name "$name" --output json)
            SAMPLE=$(aws dynamodb scan --table-name "$name" --max-items 3 --output json)
            COUNT=$(aws dynamodb scan --table-name "$name" --select COUNT --query Count --output text)
            jq -n --arg name "$name" --arg count "$COUNT" --argjson desc "$DESC" --argjson sample "$SAMPLE" '{name:$name,itemCountApprox:$desc.Table.ItemCount,exactCount:($count|tonumber),keySchema:$desc.Table.KeySchema,attributeDefinitions:$desc.Table.AttributeDefinitions,sampleItems:$sample.Items}'
          }
          A=$(inspect_table bndy-artists)
          V=$(inspect_table bndy-venues)
          E_DESC=$(aws dynamodb describe-table --table-name bndy-events --output json)
          E_SAMPLE=$(aws dynamodb scan --table-name bndy-events --filter-expression 'attribute_not_exists(#et) OR #et <> :festival' --expression-attribute-names '{"#et":"entityType"}' --expression-attribute-values '{":festival":{"S":"festival"}}' --max-items 3 --output json)
          F_SAMPLE=$(aws dynamodb scan --table-name bndy-events --filter-expression '#et = :festival' --expression-attribute-names '{"#et":"entityType"}' --expression-attribute-values '{":festival":{"S":"festival"}}' --max-items 3 --output json)
          E_COUNT=$(aws dynamodb scan --table-name bndy-events --select COUNT --filter-expression 'attribute_not_exists(#et) OR #et <> :festival' --expression-attribute-names '{"#et":"entityType"}' --expression-attribute-values '{":festival":{"S":"festival"}}' --query Count --output text)
          F_COUNT=$(aws dynamodb scan --table-name bndy-events --select COUNT --filter-expression '#et = :festival' --expression-attribute-names '{"#et":"entityType"}' --expression-attribute-values '{":festival":{"S":"festival"}}' --query Count --output text)
          E=$(jq -n --arg count "$E_COUNT" --argjson desc "$E_DESC" --argjson sample "$E_SAMPLE" '{name:"bndy-events",logicalType:"event",itemCountApprox:$desc.Table.ItemCount,exactCount:($count|tonumber),sampleItems:$sample.Items}')
          F=$(jq -n --arg count "$F_COUNT" --argjson sample "$F_SAMPLE" '{name:"bndy-events",logicalType:"festival",exactCount:($count|tonumber),sampleItems:$sample.Items}')
          jq -n --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson artists "$A" --argjson venues "$V" --argjson events "$E" --argjson festivals "$F" '{verifiedAt:$verifiedAt,artists:$artists,venues:$venues,events:$events,festivals:$festivals,totalLogicalEntities:($artists.exactCount+$venues.exactCount+$events.exactCount+$festivals.exactCount)}' > ops/canonical-bndy-corpus-inspection.json
      - name: Publish inspection
        run: |
          git config user.name 'bndy-backline-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ops/canonical-bndy-corpus-inspection.json
          git commit -m 'Record exact canonical BNDY corpus inspection'
          git pull --rebase --autostash origin ops/lemonrock-prod-deploy
          git push origin HEAD:ops/lemonrock-prod-deploy
