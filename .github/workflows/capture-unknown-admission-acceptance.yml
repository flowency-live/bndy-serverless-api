name: capture-unknown-admission-acceptance
# Trigger production acceptance for exact Facebook event anchoring and Capture admission/ticketing policy.

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/capture-unknown-admission-acceptance.yml'

permissions:
  contents: write

env:
  AWS_REGION: eu-west-2

jobs:
  deploy_and_replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout serverless API
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout current enrichment main
        uses: actions/checkout@v4
        with:
          repository: flowency-live/bndy-enrichment
          ref: main
          path: enrichment

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify current Capture code
        working-directory: enrichment
        run: |
          set -euo pipefail
          npm install
          npm run check

      - name: Bundle and hot-deploy Capture processor
        working-directory: enrichment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/capture-lambda /tmp/capture-processor.zip
          mkdir -p /tmp/capture-lambda
          npx esbuild src/handlers/capture-processor.ts \
            --bundle --platform=node --target=node22 --format=cjs \
            --outfile=/tmp/capture-lambda/index.js
          cd /tmp/capture-lambda
          zip -q /tmp/capture-processor.zip index.js
          aws lambda update-function-code --region "$AWS_REGION" \
            --function-name bndy-capture-processor \
            --zip-file fileb:///tmp/capture-processor.zip \
            > /tmp/update-code.json
          aws lambda wait function-updated --region "$AWS_REGION" \
            --function-name bndy-capture-processor
          aws lambda get-function-configuration --region "$AWS_REGION" \
            --function-name bndy-capture-processor \
            --query '{LastModified:LastModified,CodeSha256:CodeSha256,Runtime:Runtime,State:State,LastUpdateStatus:LastUpdateStatus}' \
            --output json > /tmp/processor-config.json

      - name: Resolve Capture token
        shell: bash
        run: |
          set -euo pipefail
          CAPTURE_FN=$(aws cloudformation describe-stacks \
            --stack-name bndy-capture --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='CaptureFunctionName'].OutputValue | [0]" --output text)
          CAPTURE_TOKEN=$(aws lambda get-function-configuration --region "$AWS_REGION" \
            --function-name "$CAPTURE_FN" \
            --query 'Environment.Variables.CAPTURE_TOKEN' --output text)
          test -n "$CAPTURE_TOKEN" && test "$CAPTURE_TOKEN" != "None"
          echo "::add-mask::$CAPTURE_TOKEN"
          echo "CAPTURE_TOKEN=$CAPTURE_TOKEN" >> "$GITHUB_ENV"

      - name: Replay Millhouse Facebook Event twice
        shell: bash
        run: |
          set -euo pipefail
          CAPTURE_ID='49d685c6-9b0c-41f8-b605-9f38eef1c0c2'
          EXPECTED_EVENT_URL='https://www.facebook.com/events/1052283023872867/'
          EXPECTED_EVENT_ID='a81f41ef-53c2-43a3-babe-5a13ad5d3870'

          replay_once() {
            local run="$1"
            local before="/tmp/run-${run}-before.json"
            local after="/tmp/run-${run}-after.json"
            local scanner="/tmp/run-${run}-scanner.json"
            local new_note="/tmp/run-${run}-new-note.txt"

            curl -fsS -H "Authorization: Bearer $CAPTURE_TOKEN" \
              "https://capture.bndy.co.uk/v1/captures/$CAPTURE_ID" > "$before"

            curl -fsS -X PATCH \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer $CAPTURE_TOKEN" \
              -d '{"status":"unprocessed"}' \
              "https://capture.bndy.co.uk/v1/captures/$CAPTURE_ID/status" > "/tmp/run-${run}-reset.json"

            aws lambda invoke --region "$AWS_REGION" \
              --function-name bndy-capture-scan \
              --cli-binary-format raw-in-base64-out --payload '{}' \
              "$scanner" >/tmp/scanner-meta.json

            for i in $(seq 1 42); do
              curl -fsS -H "Authorization: Bearer $CAPTURE_TOKEN" \
                "https://capture.bndy.co.uk/v1/captures/$CAPTURE_ID" > "$after"
              STATUS=$(jq -r '.capture.status // .status // empty' "$after")
              echo "run=$run poll=$i status=$STATUS"
              if [ -n "$STATUS" ] && [ "$STATUS" != "unprocessed" ] && [ "$STATUS" != "processing" ]; then
                break
              fi
              sleep 10
            done

            node - "$before" "$after" "$new_note" <<'NODE'
          const fs = require('fs');
          const [, , beforePath, afterPath, outPath] = process.argv;
          const unwrap = value => value.capture || value;
          const before = unwrap(JSON.parse(fs.readFileSync(beforePath, 'utf8')));
          const after = unwrap(JSON.parse(fs.readFileSync(afterPath, 'utf8')));
          const oldNote = before.note || '';
          const fullNote = after.note || '';
          const fresh = fullNote.startsWith(oldNote) ? fullNote.slice(oldNote.length).trim() : fullNote.trim();
          fs.writeFileSync(outPath, fresh);
          NODE

            FINAL_STATUS=$(jq -r '.capture.status // .status // empty' "$after")
            test "$FINAL_STATUS" = 'processed'
            grep -F 'Capture classification: event' "$new_note"
            grep -F 'Artist: Millhouse' "$new_note"
            grep -F "Canonical capture URL: $EXPECTED_EVENT_URL" "$new_note"
            grep -F '2026-10-17 21:00' "$new_note"
            grep -F "existing duplicate $EXPECTED_EVENT_ID" "$new_note"
            grep -F 'Events: 0 created, 1 existing duplicates, 0 held.' "$new_note"
            ! grep -Fq 'admission unknown' "$new_note"
            ! grep -Fq '2027-' "$new_note"
            ! grep -Fq 'skipped -' "$new_note"
            ! grep -Fq 'failed after' "$new_note"
          }

          replay_once 1
          replay_once 2

      - name: Publish sanitized acceptance result
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p diagnostics
          [ -s /tmp/run-1-before.json ] || echo '{}' > /tmp/run-1-before.json
          [ -s /tmp/run-1-after.json ] || echo '{}' > /tmp/run-1-after.json
          [ -s /tmp/run-2-after.json ] || echo '{}' > /tmp/run-2-after.json
          [ -s /tmp/run-1-scanner.json ] || echo '{}' > /tmp/run-1-scanner.json
          [ -s /tmp/run-2-scanner.json ] || echo '{}' > /tmp/run-2-scanner.json
          [ -s /tmp/run-1-new-note.txt ] || : > /tmp/run-1-new-note.txt
          [ -s /tmp/run-2-new-note.txt ] || : > /tmp/run-2-new-note.txt
          [ -s /tmp/processor-config.json ] || echo '{}' > /tmp/processor-config.json

          jq -n \
            --arg inspectedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson before "$(jq '.capture // .' /tmp/run-1-before.json)" \
            --argjson after1 "$(jq '.capture // .' /tmp/run-1-after.json)" \
            --argjson after2 "$(jq '.capture // .' /tmp/run-2-after.json)" \
            --arg run1Note "$(cat /tmp/run-1-new-note.txt)" \
            --arg run2Note "$(cat /tmp/run-2-new-note.txt)" \
            --argjson scanner1 "$(cat /tmp/run-1-scanner.json)" \
            --argjson scanner2 "$(cat /tmp/run-2-scanner.json)" \
            --argjson processor "$(cat /tmp/processor-config.json)" \
            '{result:"FACEBOOK_EVENT_STABILITY_ACCEPTANCE",inspectedAt:$inspectedAt,before:{id:$before.id,status:$before.status,sharedUrl:$before.sharedUrl,processingAttempt:$before.processingAttempt},run1:{status:$after1.status,processingAttempt:$after1.processingAttempt,note:$run1Note,scanner:$scanner1},run2:{status:$after2.status,processingAttempt:$after2.processingAttempt,note:$run2Note,scanner:$scanner2},processor:$processor}' \
            > diagnostics/capture-unknown-admission-acceptance.json

          git config user.name 'bndy-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add diagnostics/capture-unknown-admission-acceptance.json
          git commit -m 'Record Facebook Event stability acceptance result' || exit 0
          git push --force origin HEAD:capture-unknown-admission-results
