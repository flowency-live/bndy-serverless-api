name: capture-unknown-admission-acceptance
# Trigger final production acceptance for publish-always + non-ticketed-by-default Capture policy.

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/capture-unknown-admission-acceptance.yml'

permissions:
  contents: write

env:
  AWS_REGION: eu-west-2

jobs:
  deploy_and_replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout serverless API
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout current enrichment main
        uses: actions/checkout@v4
        with:
          repository: flowency-live/bndy-enrichment
          ref: main
          path: enrichment

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify current Capture code
        working-directory: enrichment
        run: |
          set -euo pipefail
          npm install
          npm run check

      - name: Bundle and hot-deploy Capture processor
        working-directory: enrichment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/capture-lambda /tmp/capture-processor.zip
          mkdir -p /tmp/capture-lambda
          npx esbuild src/handlers/capture-processor.ts \
            --bundle --platform=node --target=node22 --format=cjs \
            --outfile=/tmp/capture-lambda/index.js
          cd /tmp/capture-lambda
          zip -q /tmp/capture-processor.zip index.js
          aws lambda update-function-code --region "$AWS_REGION" \
            --function-name bndy-capture-processor \
            --zip-file fileb:///tmp/capture-processor.zip \
            > /tmp/update-code.json
          aws lambda wait function-updated --region "$AWS_REGION" \
            --function-name bndy-capture-processor
          aws lambda get-function-configuration --region "$AWS_REGION" \
            --function-name bndy-capture-processor \
            --query '{LastModified:LastModified,CodeSha256:CodeSha256,Runtime:Runtime,State:State,LastUpdateStatus:LastUpdateStatus}' \
            --output json > /tmp/processor-config.json

      - name: Resolve Capture token
        shell: bash
        run: |
          set -euo pipefail
          CAPTURE_FN=$(aws cloudformation describe-stacks \
            --stack-name bndy-capture --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='CaptureFunctionName'].OutputValue | [0]" --output text)
          CAPTURE_TOKEN=$(aws lambda get-function-configuration --region "$AWS_REGION" \
            --function-name "$CAPTURE_FN" \
            --query 'Environment.Variables.CAPTURE_TOKEN' --output text)
          test -n "$CAPTURE_TOKEN" && test "$CAPTURE_TOKEN" != "None"
          echo "::add-mask::$CAPTURE_TOKEN"
          echo "CAPTURE_TOKEN=$CAPTURE_TOKEN" >> "$GITHUB_ENV"

      - name: Replay held Millhouse event
        shell: bash
        run: |
          set -euo pipefail
          CAPTURE_ID='49d685c6-9b0c-41f8-b605-9f38eef1c0c2'

          curl -fsS -H "Authorization: Bearer $CAPTURE_TOKEN" \
            "https://capture.bndy.co.uk/v1/captures/$CAPTURE_ID" > /tmp/before.json

          curl -fsS -X PATCH \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $CAPTURE_TOKEN" \
            -d '{"status":"unprocessed"}' \
            "https://capture.bndy.co.uk/v1/captures/$CAPTURE_ID/status" > /tmp/reset.json

          aws lambda invoke --region "$AWS_REGION" \
            --function-name bndy-capture-scan \
            --cli-binary-format raw-in-base64-out --payload '{}' \
            /tmp/scanner.json >/tmp/scanner-meta.json

          for i in $(seq 1 42); do
            curl -fsS -H "Authorization: Bearer $CAPTURE_TOKEN" \
              "https://capture.bndy.co.uk/v1/captures/$CAPTURE_ID" > /tmp/after.json
            STATUS=$(jq -r '.capture.status // .status // empty' /tmp/after.json)
            echo "poll=$i status=$STATUS"
            if [ -n "$STATUS" ] && [ "$STATUS" != "unprocessed" ] && [ "$STATUS" != "processing" ]; then
              break
            fi
            sleep 10
          done

          FINAL_STATUS=$(jq -r '.capture.status // .status // empty' /tmp/after.json)
          FINAL_NOTE=$(jq -r '.capture.note // .note // ""' /tmp/after.json)
          test "$FINAL_STATUS" = 'processed'
          echo "$FINAL_NOTE" | grep -F 'Artist: Millhouse'
          echo "$FINAL_NOTE" | grep -F '2026-10-17'
          echo "$FINAL_NOTE" | grep -Eq 'created [0-9a-f-]{36}|existing duplicate [0-9a-f-]{36}'
          ! echo "$FINAL_NOTE" | grep -Fq 'admission unknown'

      - name: Publish sanitized acceptance result
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p diagnostics
          [ -s /tmp/before.json ] || echo '{}' > /tmp/before.json
          [ -s /tmp/after.json ] || echo '{}' > /tmp/after.json
          [ -s /tmp/scanner.json ] || echo '{}' > /tmp/scanner.json
          [ -s /tmp/processor-config.json ] || echo '{}' > /tmp/processor-config.json

          jq -n \
            --arg inspectedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson before "$(jq '.capture // .' /tmp/before.json)" \
            --argjson after "$(jq '.capture // .' /tmp/after.json)" \
            --argjson scanner "$(cat /tmp/scanner.json)" \
            --argjson processor "$(cat /tmp/processor-config.json)" \
            '{result:"UNKNOWN_ADMISSION_CAPTURE_ACCEPTANCE",inspectedAt:$inspectedAt,before:{id:$before.id,status:$before.status,sharedUrl:$before.sharedUrl,note:$before.note,processingAttempt:$before.processingAttempt},after:{id:$after.id,status:$after.status,sharedUrl:$after.sharedUrl,note:$after.note,processingAttempt:$after.processingAttempt},scanner:$scanner,processor:$processor}' \
            > diagnostics/capture-unknown-admission-acceptance.json

          git config user.name 'bndy-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add diagnostics/capture-unknown-admission-acceptance.json
          git commit -m 'Record unknown-admission Capture acceptance result' || exit 0
          git push --force origin HEAD:capture-unknown-admission-results
