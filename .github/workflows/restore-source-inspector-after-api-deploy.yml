name: Restore Source Inspector After API Deploy

on:
  workflow_run:
    workflows: ["Deploy BNDY API"]
    types: [completed]

permissions:
  contents: read
  statuses: write

env:
  AWS_REGION: eu-west-2
  NODE_VERSION: '20'
  SAM_CLI_TELEMETRY: '0'

jobs:
  restore:
    name: Restore and browser-smoke source inspector
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: artists-lambda/package-lock.json

      - name: Verify source inspector before restore
        working-directory: artists-lambda
        run: |
          npm ci --legacy-peer-deps
          node --test source-inspector.test.js source-inspector-v2.test.js

      - name: Verify shared identity copies
        run: node shared/identity/check-sync.test.js

      - name: Keep production dependencies only
        working-directory: artists-lambda
        run: npm prune --omit=dev --ignore-scripts

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve existing BNDY HTTP API
        shell: bash
        run: |
          set -euo pipefail
          API_ID=$(aws cloudformation describe-stacks \
            --stack-name bndy-serverless-api \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='BndyHttpApiId'].OutputValue | [0]" \
            --output text)
          test -n "$API_ID" && test "$API_ID" != "None"
          echo "BNDY_HTTP_API_ID=$API_ID" >> "$GITHUB_ENV"

      - name: Build source inspector companion stack
        run: |
          sam build \
            --template-file source-inspector-template.yaml \
            --build-dir .aws-sam-source-inspector

      - name: Restore source inspector companion stack
        run: |
          sam deploy \
            --template-file .aws-sam-source-inspector/template.yaml \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name bndy-source-inspector \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM \
            --s3-bucket bndy-deployment-artifacts-1758805276 \
            --s3-prefix bndy-source-inspector \
            --parameter-overrides BndyHttpApiId="$BNDY_HTTP_API_ID"

      - name: Wait for API Gateway propagation
        run: sleep 7

      - name: Browser-style CORS and route smoke test
        shell: bash
        run: |
          set -euo pipefail
          URL='https://api.bndy.co.uk/api/community/source/inspect'
          ORIGIN='https://map.bndy.co.uk'

          headers=$(mktemp)
          status=$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' \
            -X OPTIONS "$URL" \
            -H "Origin: $ORIGIN" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type')
          case "$status" in 200|204) ;; *) echo "CORS preflight returned $status"; cat "$headers"; exit 1;; esac
          grep -qi "^access-control-allow-origin: $ORIGIN" "$headers"
          grep -qi '^access-control-allow-methods:.*POST' "$headers"

          headers=$(mktemp)
          status=$(curl -sS -D "$headers" -o /tmp/source-inspector-empty.json -w '%{http_code}' \
            -X POST "$URL" \
            -H "Origin: $ORIGIN" \
            -H 'content-type: application/json' \
            --data '{"input":""}')
          test "$status" = "400"
          grep -q 'INPUT_REQUIRED' /tmp/source-inspector-empty.json
          grep -qi "^access-control-allow-origin: $ORIGIN" "$headers"

          status=$(curl -sS -o /tmp/source-inspector-host.json -w '%{http_code}' \
            -X POST "$URL" \
            -H 'content-type: application/json' \
            --data '{"input":"https://evil.example/facebook.com/not-a-page"}')
          test "$status" = "422"
          grep -q 'NOT_FACEBOOK_URL' /tmp/source-inspector-host.json

      - name: Mark post-API inspector restore successful
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -d '{"state":"success","context":"source-inspector/after-api-deploy","description":"Inspector restored after full API deploy; CORS + route smoke passed"}'

      - name: Mark post-API inspector restore failed
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -d '{"state":"failure","context":"source-inspector/after-api-deploy","description":"Inspector restore or browser CORS smoke failed"}'
