name: Deploy consolidated Chatzone via Amplify

on:
  push:
    branches:
      - dropzone-poster-diagnostic
    paths:
      - '.github/workflows/deploy-chatzone-amplify.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ops
        uses: actions/checkout@v4
        with:
          ref: dropzone-poster-diagnostic
          path: ops

      - name: Checkout Chatzone
        uses: actions/checkout@v4
        with:
          repository: flowency-live/bndy-chatzone
          ref: main
          path: chatzone

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chatzone/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Test and build Chatzone
        working-directory: chatzone
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run test:run
          npm run build
          grep -R -q 'capture.bndy.co.uk' dist/assets
          if grep -R -q '/signals' dist/assets; then
            echo 'Old Signals API reference remains in built bundle' >&2
            exit 1
          fi
          cd dist
          zip -qr /tmp/chatzone.zip .
          test -s /tmp/chatzone.zip

      - name: Resolve Amplify app
        shell: bash
        run: |
          set -euo pipefail
          APP_ID=d26nztin494lzx
          REGION=eu-west-2
          aws amplify get-app --region "$REGION" --app-id "$APP_ID" >/tmp/app.json
          aws amplify get-branch --region "$REGION" --app-id "$APP_ID" --branch-name main >/tmp/branch-before.json
          echo "AMPLIFY_REGION=$REGION" >> "$GITHUB_ENV"
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"

      - name: Create and upload manual deployment
        shell: bash
        run: |
          set -euo pipefail
          aws amplify create-deployment --region "$AMPLIFY_REGION" --app-id "$APP_ID" --branch-name main >/tmp/create-deployment.json
          JOB_ID=$(jq -r '.jobId // empty' /tmp/create-deployment.json)
          UPLOAD_URL=$(jq -r '.zipUploadUrl // empty' /tmp/create-deployment.json)
          test -n "$JOB_ID"
          test -n "$UPLOAD_URL"
          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"
          curl -fsS -X PUT -H 'Content-Type: application/zip' --upload-file /tmp/chatzone.zip "$UPLOAD_URL"
          aws amplify start-deployment --region "$AMPLIFY_REGION" --app-id "$APP_ID" --branch-name main --job-id "$JOB_ID" >/tmp/start-deployment.json

      - name: Wait for deployment
        shell: bash
        run: |
          set -euo pipefail
          FINAL=''
          for i in $(seq 1 120); do
            aws amplify get-job --region "$AMPLIFY_REGION" --app-id "$APP_ID" --branch-name main --job-id "$JOB_ID" >/tmp/job.json
            FINAL=$(jq -r '.job.summary.status' /tmp/job.json)
            echo "poll=$i status=$FINAL"
            case "$FINAL" in
              SUCCEED|FAILED|CANCELLED) break ;;
            esac
            sleep 10
          done
          test "$FINAL" = 'SUCCEED'

      - name: Smoke test live chat.bndy.live
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/index.html /tmp/bundle.txt
          OK=0
          for i in $(seq 1 30); do
            if curl -fsS --retry 2 'https://chat.bndy.live/' -o /tmp/index.html; then
              if python - <<'PY'
          import re, urllib.request, pathlib
          html=pathlib.Path('/tmp/index.html').read_text(errors='replace')
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          if not srcs: raise SystemExit(2)
          body=''
          for src in srcs:
              target=src if src.startswith('http') else 'https://chat.bndy.live' + ('/' if not src.startswith('/') else '') + src
              with urllib.request.urlopen(target,timeout=30) as r:
                  body += r.read().decode('utf-8','replace')
          pathlib.Path('/tmp/bundle.txt').write_text(body)
          if 'capture.bndy.co.uk' not in body: raise SystemExit(3)
          if '/v1/public/captures' not in body: raise SystemExit(4)
          if '/signals' in body: raise SystemExit(5)
          if 'View gig on bndy.live' not in body: raise SystemExit(6)
          PY
              then OK=1; break; fi
            fi
            sleep 10
          done
          test "$OK" = '1'

      - name: Record result
        if: always()
        working-directory: ops
        shell: bash
        run: |
          set -u
          mkdir -p diagnostics
          python - <<'PY'
          import json, pathlib, datetime, os, subprocess
          def read_json(path):
              p=pathlib.Path(path)
              if not p.exists(): return {}
              try:return json.loads(p.read_text())
              except:return {}
          def read_text(path):
              p=pathlib.Path(path)
              return p.read_text(errors='replace') if p.exists() else ''
          job=read_json('/tmp/job.json').get('job',{})
          summary=job.get('summary',{})
          bundle=read_text('/tmp/bundle.txt')
          branch=read_json('/tmp/branch-before.json').get('branch',{})
          try: commit=subprocess.check_output(['git','-C','../chatzone','rev-parse','HEAD'],text=True).strip()
          except Exception: commit=None
          payload={
            'recordedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'appId':os.getenv('APP_ID'),
            'region':os.getenv('AMPLIFY_REGION'),
            'chatzoneCommit':commit,
            'branch':{
              'branchName':branch.get('branchName'),
              'stage':branch.get('stage'),
              'activeJobIdBefore':branch.get('activeJobId'),
            },
            'jobId':os.getenv('JOB_ID'),
            'jobStatus':summary.get('status'),
            'commitId':summary.get('commitId'),
            'liveUrl':'https://chat.bndy.live',
            'liveHasCaptureApi':'capture.bndy.co.uk' in bundle and '/v1/public/captures' in bundle,
            'liveHasSignalsApi':'/signals' in bundle,
            'liveHasGigLink':'View gig on bndy.live' in bundle,
          }
          pathlib.Path('diagnostics/chatzone-amplify-deploy.json').write_text(json.dumps(payload,indent=2))
          PY
          git config user.name bndy-bot
          git config user.email actions@users.noreply.github.com
          git add diagnostics/chatzone-amplify-deploy.json
          git commit -m 'Record Amplify Chatzone deployment' || true
          git push origin HEAD:dropzone-poster-diagnostic

# deploy trigger: result details and gig link
