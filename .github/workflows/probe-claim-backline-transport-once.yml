name: Probe Claim Backline transport once
on:
  push:
    branches: [claim-v2-backline-transport]
permissions:
  contents: read
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[claim-backline-probe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2
      - name: Probe Claims Lambda role for EventBridge transport
        shell: bash
        run: |
          set -euo pipefail
          aws iam simulate-principal-policy \
            --policy-source-arn arn:aws:iam::771551874768:role/bndy-api-instance-role \
            --action-names events:PutEvents \
            --resource-arns '*' \
            --query 'EvaluationResults[0].{Action:EvalActionName,Decision:EvalDecision,MissingContext:MissingContextValues}' \
            --output json
