name: inspect-recent-captures

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/inspect-recent-captures.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Inspect recent Capture submissions
        shell: bash
        run: |
          set -euo pipefail
          CAPTURE_FN=$(aws cloudformation describe-stacks \
            --stack-name bndy-capture --region eu-west-2 \
            --query "Stacks[0].Outputs[?OutputKey=='CaptureFunctionName'].OutputValue | [0]" \
            --output text)
          CAPTURE_TOKEN=$(aws lambda get-function-configuration \
            --region eu-west-2 --function-name "$CAPTURE_FN" \
            --query 'Environment.Variables.CAPTURE_TOKEN' --output text)
          test -n "$CAPTURE_TOKEN" && test "$CAPTURE_TOKEN" != "None"
          echo "::add-mask::$CAPTURE_TOKEN"

          # Snapshot before, kick the scanner, then snapshot again after the queue has had time to move.
          curl -fsS -H "Authorization: Bearer $CAPTURE_TOKEN" \
            'https://capture.bndy.co.uk/v1/captures?limit=30' > /tmp/before.json
          aws lambda invoke --region eu-west-2 \
            --function-name bndy-capture-scan \
            --cli-binary-format raw-in-base64-out --payload '{}' \
            /tmp/scanner.json >/tmp/scanner-meta.json || true
          sleep 30
          curl -fsS -H "Authorization: Bearer $CAPTURE_TOKEN" \
            'https://capture.bndy.co.uk/v1/captures?limit=30' > /tmp/after.json

          # Keep only non-sensitive operational fields and only the most recent captures.
          mkdir -p diagnostics
          jq -n \
            --arg inspectedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson scanner "$(cat /tmp/scanner.json 2>/dev/null || echo '{}')" \
            --argjson before "$(jq '(.captures // .items // . // []) | sort_by(.receivedAt // .capturedAt // "") | reverse | .[0:12] | map({id,capturedAt,receivedAt,updatedAt,status,sharedUrl,sharedText,mimeType,sourceApp,suggestedEntityType,note,processingAttempt,processingWorkerId,leaseUntil})' /tmp/before.json)" \
            --argjson after "$(jq '(.captures // .items // . // []) | sort_by(.receivedAt // .capturedAt // "") | reverse | .[0:12] | map({id,capturedAt,receivedAt,updatedAt,status,sharedUrl,sharedText,mimeType,sourceApp,suggestedEntityType,note,processingAttempt,processingWorkerId,leaseUntil})' /tmp/after.json)" \
            '{result:"RECENT_CAPTURE_DIAGNOSTIC",inspectedAt:$inspectedAt,scanner:$scanner,before:$before,after:$after}' \
            > diagnostics/recent-captures.json

      - name: Publish sanitized diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'bndy-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add diagnostics/recent-captures.json
          git commit -m 'Record recent Capture diagnostic' || exit 0
          git push --force origin HEAD:capture-recent-results
