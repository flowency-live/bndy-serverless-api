name: inspect-recent-captures
# Trigger: inspect fresh Android Facebook Event shares using status-index queries.

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/inspect-recent-captures.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Inspect recent Capture submissions by status
        shell: bash
        run: |
          set -euo pipefail
          CAPTURE_FN=$(aws cloudformation describe-stacks \
            --stack-name bndy-capture --region eu-west-2 \
            --query "Stacks[0].Outputs[?OutputKey=='CaptureFunctionName'].OutputValue | [0]" \
            --output text)
          CAPTURE_TOKEN=$(aws lambda get-function-configuration \
            --region eu-west-2 --function-name "$CAPTURE_FN" \
            --query 'Environment.Variables.CAPTURE_TOKEN' --output text)
          test -n "$CAPTURE_TOKEN" && test "$CAPTURE_TOKEN" != "None"
          echo "::add-mask::$CAPTURE_TOKEN"

          fetch_statuses() {
            local prefix="$1"
            for status in unprocessed processing processed failed rejected ignored; do
              curl -fsS -H "Authorization: Bearer $CAPTURE_TOKEN" \
                "https://capture.bndy.co.uk/v1/captures?status=${status}&limit=20" \
                > "/tmp/${prefix}-${status}.json"
            done
          }

          combine_recent() {
            local prefix="$1"
            jq -s '
              [ .[] | (.items // .captures // [])[] ]
              | unique_by(.id)
              | map(select((.receivedAt // .capturedAt // "") >= "2026-08-22T10:45:00Z"))
              | sort_by(.receivedAt // .capturedAt // "")
              | reverse
              | map({id,capturedAt,receivedAt,updatedAt,status,sharedUrl,sharedText,mimeType,sourceApp,suggestedEntityType,note,processingAttempt,processingWorkerId,leaseUntil})
            ' /tmp/${prefix}-*.json
          }

          fetch_statuses before
          aws lambda invoke --region eu-west-2 \
            --function-name bndy-capture-scan \
            --cli-binary-format raw-in-base64-out --payload '{}' \
            /tmp/scanner.json >/tmp/scanner-meta.json || true
          sleep 45
          fetch_statuses after

          mkdir -p diagnostics
          jq -n \
            --arg inspectedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson scanner "$(cat /tmp/scanner.json 2>/dev/null || echo '{}')" \
            --argjson before "$(combine_recent before)" \
            --argjson after "$(combine_recent after)" \
            '{result:"RECENT_CAPTURE_STATUS_DIAGNOSTIC",inspectedAt:$inspectedAt,cutoff:"2026-08-22T10:45:00Z",scanner:$scanner,before:$before,after:$after}' \
            > diagnostics/recent-captures.json

      - name: Publish sanitized diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'bndy-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add diagnostics/recent-captures.json
          git commit -m 'Record recent Capture status diagnostic' || exit 0
          git push --force origin HEAD:capture-recent-results
